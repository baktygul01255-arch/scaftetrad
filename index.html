// ===== Экспорт =====
function fieldHTML(f,x,v){
  const p=s=>`<p>${esc(s).replace(/\n/g,'<br>')}</p>`;
  const L=f.label?`<p><b>${esc(T(f.label))}</b></p>`:'';
  const cardT=id=>CARD[id]?`${T(CARD[id].title)} (${T(GROUPS[CARD[id].g].short)}${id.includes('.')?' '+id:''})`:'';
  const TB='<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%">';
  switch(f.t){
    case 'h': return `<h4>${esc(T(f.text))}</h4>`;
    case 'note': return '';
    case 'text': case 'area': return nonEmpty(x)? L+p(x) : '';
    case 'choice': return nonEmpty(x)? L+p(T(x)) : '';
    case 'row': return f.items.map(g=>fieldHTML(g,v[g.k],v)).join('');
    case 'list': { const a=(x||[]).filter(nonEmpty); return a.length? L+'<ol>'+a.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>':''; }
    case 'check': return L+'<ul>'+f.items.map((t,i)=>`<li>${(x||{})[i]?'☑':'☐'} ${esc(T(t))}</li>`).join('')+'</ul>';
    case 'table': { const X=x||{}; const cn=i=>f.colInput?(X['h|'+i]||T((f.colDefaults||[])[i]||f.cols[i])):T(f.cols[i]);
      return L+TB+`<tr><th></th>${f.cols.map((c,i)=>`<th>${esc(cn(i))}</th>`).join('')}</tr>`+f.rows.map((r,ri)=>`<tr><th align="left">${esc(T(r))}</th>${f.cols.map((c,ci)=>`<td>${esc(X[ri+'|'+ci]||'').replace(/\n/g,'<br>')}</td>`).join('')}</tr>`).join('')+'</table>'; }
    case 'cards': { const a=x||[]; return a.length? L+'<ul>'+a.map(it=>`<li><b>${esc(cardT(it.id))}</b>${nonEmpty(it.why)?' — '+esc(it.why):''}</li>`).join('')+'</ul>':''; }
    case 'rep': { const a=(x||[]).filter(it=>it&&Object.values(it).some(z=>Array.isArray(z)?z.length:nonEmpty(String(z??'')))); if(!a.length) return '';
      let s=TB+`<tr><th>№</th>${f.fields.map(sf=>`<th>${esc(T(sf.label))}</th>`).join('')}</tr>`;
      a.forEach((it,i)=>{ s+=`<tr><td>${i+1}</td>${f.fields.map(sf=>{ let z=it[sf.k]; if(sf.t==='card') z=cardT(z); else if(Array.isArray(z)) z=z.map(T).join('; '); else if(sf.t==='select') z=T(z); return `<td>${esc(z||'').replace(/\n/g,'<br>')}</td>`; }).join('')}</tr>`; });
      if(f.total) s+=`<tr><td></td><td colspan="${f.fields.length}" align="right"><b>${esc(T(f.totalLabel||'Итого'))}: ${a.reduce((q,it)=>q+(parseFloat(it[f.total])||0),0)}</b></td></tr>`;
      return s+'</table>'; }
    case 'rank': { const o=(x&&x.o)||f.items.map((_,i)=>i); return `<p><b>${esc(T('Принципы Scaffold по приоритету'))}</b></p><ol>`+o.map(i=>`<li>${esc(T(f.items[i]))}</li>`).join('')+'</ol>'; }
    case 'order': { const o=(x&&x.o)||[]; return o.length?`<p><b>${esc(T('Последовательность карт «Планирование»'))}</b></p><ol>`+o.map(id=>`<li>${esc(T(CARD[id].title))}</li>`).join('')+'</ol>':''; }
    case 'stickies': return TB+f.cards.map(id=>`<tr><th align="left" width="30%">${esc(T(CARD[id].title))}</th><td>${esc((x||{})[id]||'')}</td></tr>`).join('')+'</table>';
    case 'mindmap': { const ns=(x&&x.nodes)||[]; return `<p><b>${esc(T(f.center))}</b></p>`+TB+`<tr><th>${esc(T('Элемент'))}</th><th>${esc(T('Влияние на процесс обучения'))}</th><th>${esc(T('Влияние на профессиональную деятельность'))}</th></tr>`+ns.map(b=>`<tr><td>${esc(b.n)}</td><td>${esc(b.p)}</td><td>${esc(b.r)}</td></tr>`).join('')+'</table>'; }
    case 'emotions': { const X=x||{}; const ks=Object.keys(X).filter(k=>nonEmpty(X[k])); return ks.length?`<p><b>${esc(T('Карта эмоций'))}</b></p><ul>`+ks.map(k=>`<li><b>${esc(T(k))}:</b> ${esc(X[k])}</li>`).join('')+'</ul>':''; }
    case 'swot': { const X=x||{}; const q=k=>'<ul>'+((X[k]||[]).filter(nonEmpty).map(s=>`<li>${esc(s)}</li>`).join(''))+'</ul>';
      return `<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%"><tr><td width="50%"><b>S — ${esc(T('Сильные стороны'))}</b>${q('s')}</td><td><b>W — ${esc(T('Слабые стороны'))}</b>${q('w')}</td></tr><tr><td><b>O — ${esc(T('Возможности'))}</b>${q('o')}</td><td><b>T — ${esc(T('Угрозы'))}</b>${q('t')}</td></tr></table>`; }
    case 'quad2': return f.items.map(it=>fieldHTML(it.list?{t:'list',label:it.label}:{t:'area',label:it.label},(x||{})[it.k],x||{})).join('');
    case 'rating': { const X=x||{}; const src=v[f.colsFrom]||{}; const names=[0,1,2].map(i=>src['h|'+i]||T(ACT['2.1'].fields[0].colDefaults[i]));
      return TB+`<tr><th>${esc(T('Оценка 1–5'))}</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>`+f.rows.map((r,ri)=>`<tr><td>${esc(T(r))}</td>${[0,1,2].map(ci=>`<td align="center">${X[ri+'|'+ci]||''}</td>`).join('')}</tr>`).join('')+'</table>'; }
    case 'score': { const X=x||{}; const s=f.items.reduce((q,_,i)=>q+(+X[i]||0),0); return L+'<ul>'+f.items.map((it,i)=>`<li>${esc(T(it.t))}: ${X[i]??0} / ${it.max}</li>`).join('')+`</ul><p><b>${f.avg?esc(T('Итоговая оценка'))+': '+Math.round(s/f.items.length)+' / 100':esc(T('Итого'))+': '+s}</b></p>`; }
    case 'stairs': { const a=(x||[]).filter(it=>nonEmpty(it.s)); return a.length?`<p><b>${esc(T(f.label))}</b></p><ol>`+a.map(it=>`<li>${esc(it.s)}${nonEmpty(it.d)?' — '+esc(it.d):''}</li>`).join('')+'</ol>':''; }
  }
  return '';
}

    el('p',{style:'margin:0;font-size:13.5px;color:var(--ink-2)'},T('Цель курса — развить педагогические компетенции для проектирования компетентностно-ориентированных занятий. По завершении вы применяете методы Scaffold при создании структурных элементов занятий и проектируете учебное занятие для формирования ключевых компетенций обучающихся.')));
  sheet.append(el('div',{class:'home-grid'},prof,mods,deck));
  main.append(sheet);
}
let deckFilter='all', deckQ='';
function renderDeck(main){
  const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-h'}, el('div',{class:'eyebrow'},T('Справочник')), el('h1',{},T('Колода карт Scaffold')), el('p',{style:'margin:0;color:var(--ink-2);max-width:70ch'},T('Все карты из набора с описаниями, заданиями для обучающихся и связями между рамками компетенций.'))));
  const chips=el('div',{class:'chips'});
  const grid=el('div',{class:'cgrid',style:'margin-top:16px'});
  const draw=()=>{
    chips.innerHTML='';
    [['all','Все'],...Object.entries(GROUPS).map(([g,G])=>[g,G.short])].forEach(([g,t])=>chips.append(el('button',{type:'button',class:'chip'+(deckFilter===g?' on':''),onclick:()=>{deckFilter=g;draw();}},T(t))));
    grid.innerHTML='';
    const gs= deckFilter==='all'? Object.keys(GROUPS) : [deckFilter];
    gs.forEach(g=>{ const list=CARDS.filter(c=>c.g===g&&(!deckQ||(T(c.title)+' '+T(c.desc)+' '+T(c.task||'')+' '+c.id).toLowerCase().includes(deckQ))); if(!list.length) return;
      grid.append(el('div',{class:'cgroup-h'},`${T(GROUPS[g].name)} · ${list.length}`)); list.forEach(c=>grid.append(cardEl(c.id,{desc:true,onClick:()=>openCard(c.id)}))); });
    if(!grid.children.length) grid.append(el('p',{style:'color:var(--ink-3)'},T('Ничего не найдено. Измените запрос.')));
  };
  const s=el('input',{class:'inp',type:'search',id:'deck-q',placeholder:T('Поиск: например, «рефлексия» или «e.4»'),style:'max-width:420px',oninput:e=>{deckQ=e.target.value.trim().toLowerCase();draw();}}); s.value=deckQ;
  sheet.append(el('div',{style:'display:grid;gap:12px'},s,chips),grid);
  draw(); main.append(sheet);
}
function renderCrit(main){
  const x=V('crit'); const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-h'}, el('div',{class:'eyebrow'},T('Приложение 1 к образовательной программе')), el('h1',{},T('Критерии оценки итоговой работы')),
    el('div',{class:'task'}, el('p',{},T('Предмет оценивания — план урока с использованием инструмента Scaffold (Activity 2.15). Оцените свою работу по критериям. Для рекомендации к сертификации нужно не менее 50 баллов из 100 и все активити по каждому модулю.')))));
  const big=el('span',{class:'big'}); const st=el('span',{class:'res'});
  const upd=()=>{ const t=CRITERIA.reduce((s,_,i)=>s+(+x[i]||0),0); big.textContent=t; st.className='res '+(t>=50?'ok':'no'); st.textContent=T(t>=50?'Порог сертификации пройден':'Ниже порога 50 баллов'); };
  const box=el('div',{class:'score'});
  CRITERIA.forEach((c,i)=>{ const out=el('span',{class:'score-v'}); const r=el('input',{type:'range',min:'0',max:String(c.max),id:'cr'+i,'aria-label':T(c.t)}); r.value=x[i]??0; out.textContent=(x[i]??0)+' / '+c.max;
    r.addEventListener('input',()=>{x[i]=+r.value;out.textContent=r.value+' / '+c.max;upd();touch('crit');}); box.append(el('div',{class:'score-it'},el('label',{for:r.id},T(c.t)),r,out)); });
  sheet.append(el('div',{class:'crit-total',style:'margin-bottom:16px'}, big, el('span',{class:'of'},T('из 100')), st, el('a',{class:'btn sm',href:'#a2.15',style:'margin-left:auto'},T('Открыть план урока 2.15'))), box);
  upd(); main.append(sheet);
}
function renderAct(main,id){
  const a=ACT[id]; const v=V(a.id);
  const i=ACTS.indexOf(a); const prev=ACTS[i-1], next=ACTS[i+1];
  const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-num','aria-hidden':'true'},a.id));
  const meta=el('div',{class:'meta'}, el('span',{class:'tag'},T(a.mode)));
  if(a.card) meta.append(el('div',{style:'width:240px;max-width:100%'}, cardEl(a.card,{mini:true,onClick:()=>openCard(a.card)})));
  sheet.append(el('div',{class:'act-h'},
    el('div',{class:'eyebrow'},`${T(a.module.id==='m1'?'Модуль 1':'Модуль 2')} · ${T('Тема')} ${a.topic.id} · Activity ${a.id}`),
    el('h1',{},T(a.title)), meta,
    el('div',{class:'task'}, el('p',{},T(a.task)), a.steps?el('ol',{},a.steps.map(s=>el('li',{},T(s)))):null)));
  const fields=el('div',{class:'fields'}); a.fields.forEach(f=>fields.append(mount(f,v,a))); sheet.append(fields);
  const fb=el('div',{class:'fb',hidden:!v._fb}); if(v._fb){ fb.append(el('div',{class:'fb-h'},T('Отзыв ИИ-тренера')), el('div',{},v._fb)); }
  const aiBtn=el('button',{class:'btn',type:'button',hidden:true,onclick:()=>aiFeedback(a,fb,aiBtn)},iconEl('spark'), T(a.final?'Предварительная оценка ИИ-тренера':'Отзыв ИИ-тренера'));
  getSample().then(s=>{ if(s) aiBtn.hidden=false; });
  sheet.append(el('div',{class:'acts-bar'},
    prev?el('a',{class:'btn ghost',href:'#a'+prev.id},iconEl('left'),'Activity '+prev.id):null,
    aiBtn, el('span',{style:'flex:1'}),
    el('span',{style:'font-size:13px;color:var(--ink-3)'},T('Заполнено {0}%',Math.round(actPct(a)*100))),
    next?el('a',{class:'btn pri',href:'#a'+next.id},'Activity '+next.id,iconEl('right')):el('a',{class:'btn pri',href:'#crit'},T('К критериям'),iconEl('right'))), fb);
  main.append(sheet);
}
function render(){
  const r=currentRoute(); const main=$('#main'); const y=window.scrollY; main.innerHTML='';
  if(r.page==='act') renderAct(main,r.id); else if(r.page==='deck') renderDeck(main); else if(r.page==='crit') renderCrit(main); else renderHome(main);
  renderNav(); refreshProgress();
}
window.addEventListener('hashchange',()=>{ render(); window.scrollTo({top:0}); });
$('#menu').addEventListener('click',()=>$('#nav').classList.toggle('open'));
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.l!==LANG) setLang(b.dataset.l); }));
$('#theme').addEventListener('click',()=>setTheme(curTheme()==='dark'?'light':'dark'));
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(!THEME) applyChrome(); });
setStatus('local'); applyChrome(); render(); initCloud();

</script>
