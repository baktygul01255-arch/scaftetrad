<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рабочая тетрадь Scaffold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Тетрадь в клетку: лист с полями, синяя ручка, жёлтые стикеры, цветные карты Scaffold */
:root{
  --paper:#f6f8fc; --sheet:#fdfdff; --grid:rgba(60,100,180,.10); --margin:#e05a5f;
  --ink:#1b2540; --ink-2:#4f5b75; --ink-3:#8590a8; --line:#dbe2ee; --line-2:#c6d0e2;
  --pen:#2343b5; --pen-soft:#e7ecfb; --pen-ink:#fff;
  --sticky:#fff2a1; --sticky-2:#ffe979; --sticky-ink:#3b3300;
  --ok:#1b8a4b; --ok-soft:#e1f4e8; --warn:#b26a00; --bad:#c23b3b; --bad-soft:#fbe6e6;
  --panel:#ffffff; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.06);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11151f; --sheet:#161c29; --grid:rgba(140,170,240,.06); --margin:#b9545a;
  --ink:#e7ecf7; --ink-2:#a9b3c9; --ink-3:#77829b; --line:#283149; --line-2:#36415d;
  --pen:#8aa2ff; --pen-soft:#222c4a; --pen-ink:#0e1424;
  --sticky:#3a3519; --sticky-2:#4a431c; --sticky-ink:#f6eebd;
  --ok:#5fd08e; --ok-soft:#163324; --warn:#f0b04a; --bad:#ff8080; --bad-soft:#3a1d22;
  --panel:#1a2132; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11151f; --sheet:#161c29; --grid:rgba(140,170,240,.06); --margin:#b9545a;
  --ink:#e7ecf7; --ink-2:#a9b3c9; --ink-3:#77829b; --line:#283149; --line-2:#36415d;
  --pen:#8aa2ff; --pen-soft:#222c4a; --pen-ink:#0e1424;
  --sticky:#3a3519; --sticky-2:#4a431c; --sticky-ink:#f6eebd;
  --ok:#5fd08e; --ok-soft:#163324; --warn:#f0b04a; --bad:#ff8080; --bad-soft:#3a1d22;
  --panel:#1a2132; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}

/* ---------- Shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--pen);color:var(--pen-ink);font:700 15px var(--f-display)}
.brand-t{min-width:0}
.brand-t b{display:block;font:600 14px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.cloud i{background:var(--ok)} .pill.saving i{background:var(--warn)} .pill.err i{background:var(--bad)}
.ring{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.ring svg{display:block}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:none;background:transparent;padding:5px 9px;font:600 11.5px/1.2 var(--f-display);letter-spacing:.04em;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--pen);color:var(--pen-ink)}
.theme-btn{flex:none;width:34px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);display:grid;place-items:center;padding:0}
.theme-btn:hover,.seg button:hover{color:var(--pen)}
.seg button[aria-pressed="true"]:hover{color:var(--pen-ink)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 10px;font-size:13px}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px;font-size:13.5px}
.nav a{color:inherit;text-decoration:none}
.nav-tools{display:grid;gap:2px;margin-bottom:14px}
.nav-tool{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px}
.nav-tool:hover,.nav-act:hover{background:var(--pen-soft)}
.nav-tool.on,.nav-act.on{background:var(--pen);color:var(--pen-ink)}
.nav-tool svg{flex:none}
.nav-mod{font:600 11px/1.3 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:16px 10px 6px}
.nav-topic{font-size:12px;color:var(--ink-3);margin:10px 10px 3px;line-height:1.35}
.nav-act{display:flex;align-items:flex-start;gap:9px;padding:6px 10px;border-radius:9px;line-height:1.35}
.nav-act .num{font:600 11px/1.6 var(--f-display);min-width:30px;color:var(--ink-3)}
.nav-act.on .num{color:inherit;opacity:.8}
.st{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:2px;margin-left:auto;display:grid;place-items:center}
.st.part{border-color:var(--warn);background:conic-gradient(var(--warn) var(--p),transparent 0)}
.st.done{border-color:var(--ok);background:var(--ok)}
.st.done::after{content:"";width:6px;height:3px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- Sheet ---------- */
.sheet{position:relative;background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 32px 36px 64px;min-width:0}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:var(--margin);opacity:.55}
.eyebrow{font:600 11px/1.3 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--pen)}
.act-h{display:grid;gap:10px;margin-bottom:22px}
.act-h h1{font-size:clamp(22px,3vw,30px);line-height:1.15}
.act-num{font-family:var(--f-hand);font-size:30px;color:var(--pen);position:absolute;left:4px;top:24px;width:38px;text-align:center;line-height:1;transform:rotate(-4deg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--pen-soft);color:var(--pen);font-weight:500}
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:76ch}
.task p{margin:0}
.task ol{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
.figs{display:grid;gap:8px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.viz{width:100%;line-height:0;background:#fff;border-radius:10px;overflow:hidden}
.viz svg{width:100%;height:auto;display:block}
.viz-small{max-width:640px}
.figs .viz{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fig{margin:0;width:100%;display:flex;justify-content:center}
.fig-btn{border:none;padding:0;background:#fff;border-radius:8px;cursor:zoom-in;max-width:100%;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fig-btn img{width:100%;height:auto;border-radius:8px}
.fig-cap{font-size:12.5px;color:var(--ink-3);font-style:italic;text-align:center}
.sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:640px;align-items:end}
.sign-v{border-bottom:1.5px solid var(--ink-2);padding:4px 2px;min-height:30px;font-weight:600}
.sign-l{font-size:12px;color:var(--ink-3);font-style:italic;text-align:center;margin-top:3px}
.fields{display:grid;gap:22px;margin-top:6px}
.fh{font:600 15px/1.3 var(--f-display);margin-top:8px;padding-top:14px;border-top:1px dashed var(--line-2)}
.note{background:var(--pen-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--ink-2);max-width:80ch}
.fl{display:grid;gap:6px;min-width:0}
.fl>label,.lbl{font-weight:600;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl small{font-weight:400;color:var(--ink-3)}
.inp,textarea.inp,select.inp{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;line-height:1.45;transition:border-color .15s}
textarea.inp{resize:vertical;min-height:44px}
.inp:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px var(--pen-soft)}
.inp::placeholder{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--pen);color:var(--pen)}
.btn.pri{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--pen-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:none;background:transparent;color:var(--ink-3);padding:4px;border-radius:7px;line-height:0}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
.acts-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- Scaffold cards ---------- */
.g-ts{--g1:#2f3644;--g2:#1f242e;--gt:#fff}
.g-pl{--g1:#8a93a1;--g2:#666f7c;--gt:#fff}
.g-tr{--g1:#18b49b;--g2:#0e8f86;--gt:#fff}
.g-as{--g1:#1c58b8;--g2:#1a8fdf;--gt:#fff}
.g-tm{--g1:#0d9488;--g2:#1c74b8;--gt:#fff}
.g-d{--g1:#ec3f46;--g2:#f6801a;--gt:#fff}
.g-e{--g1:#b3127b;--g2:#7020a0;--gt:#fff}
.g-g{--g1:#1b9150;--g2:#12a35c;--gt:#fff}
.g-l{--g1:#5d9718;--g2:#86ab12;--gt:#fff}
.sc{position:relative;background:linear-gradient(140deg,var(--g1),var(--g2));color:var(--gt);border-radius:12px;padding:12px 13px 13px;display:grid;gap:6px;align-content:start;text-align:left;border:none;min-height:96px;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden;width:100%}
.sc::after{content:"";position:absolute;right:-22px;bottom:-22px;width:80px;height:80px;border:1.5px solid rgba(255,255,255,.22);border-radius:50%}
.sc .sc-g{font:600 9.5px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.08em;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.sc .sc-t{font:600 13px/1.25 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sc .sc-d{font-size:12px;line-height:1.4;opacity:.92}
.sc.mini{min-height:0;padding:8px 34px 9px 11px;border-radius:10px}
.sc.mini .sc-t{font-size:11.5px}
.sc.mini::after{display:none}
.sc .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.sc .x:hover{background:rgba(255,255,255,.4)}
.sc.sel{outline:3px solid var(--pen);outline-offset:2px}
.sc.sel::before{content:"✓";position:absolute;top:8px;right:9px;width:20px;height:20px;border-radius:50%;background:#fff;color:#123;display:grid;place-items:center;font-size:12px;font-weight:700;z-index:1}
button.sc:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.picked{display:grid;gap:12px}
.picked-it{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px;align-items:start}
.add-card{border:1.5px dashed var(--line-2);border-radius:12px;background:transparent;padding:12px;color:var(--ink-2);font-size:13.5px;display:flex;align-items:center;gap:8px;justify-content:center;min-height:48px}
.add-card:hover{border-color:var(--pen);color:var(--pen);background:var(--pen-soft)}
.sticky{background:var(--sticky);color:var(--sticky-ink);border:none;border-radius:3px 3px 14px 3px;box-shadow:0 2px 0 var(--sticky-2),0 6px 14px rgba(80,60,0,.12);padding:10px 12px;min-height:70px;width:100%;resize:vertical;line-height:1.45}
.sticky::placeholder{color:color-mix(in srgb,var(--sticky-ink) 50%,transparent)}
.sticky:focus{outline:2px solid var(--sticky-2);outline-offset:1px}

/* stickies grid (1.4) */
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.stk{display:grid;gap:8px}

/* rank */
.rank-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.rank-list{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.rank-it{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:8px 8px 8px 10px;cursor:grab;user-select:none}
.rank-it.drag{opacity:.4}
.rank-it.over{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.rank-n{font:700 15px var(--f-display);color:var(--pen);text-align:center}
.rank-b{display:flex;gap:2px}
.pyr{display:grid;gap:6px;justify-items:center}
.pyr-row{display:flex;gap:6px;justify-content:center}
.pyr-cell{background:var(--pen);color:var(--pen-ink);font:600 12px/1.2 var(--f-display);border-radius:6px;display:grid;place-items:center;padding:6px;width:60px;height:44px;text-align:center}
.pyr-row:nth-child(2) .pyr-cell{opacity:.8}
.pyr-row:nth-child(3) .pyr-cell{opacity:.6}
.pyr-cap{font-family:var(--f-hand);font-size:20px;color:var(--ink-2);text-align:center;line-height:1.1}
.pyr-legend{font-size:12px;color:var(--ink-2);display:grid;gap:3px;margin-top:6px}

/* order (planning) */
.ord{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ord-it{display:grid;gap:6px}
.ord-it .sc{min-height:118px;cursor:grab}
.ord-it .sc.drag{opacity:.4}
.ord-ctl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3)}
.ord-it.right .sc{outline:3px solid var(--ok);outline-offset:2px}
.ord-it.wrong .sc{outline:3px solid var(--bad);outline-offset:2px}
.res{font-size:13.5px;padding:6px 12px;border-radius:9px;display:inline-block}
.res.ok{background:var(--ok-soft);color:var(--ok)} .res.no{background:var(--bad-soft);color:var(--bad)}

/* mindmap */
.mm{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;align-items:center}
.mm-c{background:var(--margin);color:#fff;border-radius:14px;padding:16px 12px;font:600 13px/1.25 var(--f-display);text-align:center;position:relative}
.mm-branches{display:grid;gap:14px;padding-left:28px;border-left:2px solid var(--line-2);margin-left:0;position:relative}
.mm-b{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:start;position:relative}
.mm-b::before{content:"";position:absolute;left:-28px;top:20px;width:26px;border-top:2px solid var(--line-2)}
.mm-node{background:var(--pen-soft);border:1.5px solid var(--pen);border-radius:10px;padding:8px 10px;font-weight:600;color:var(--pen);width:100%}
.mm-head{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;padding-left:28px;font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-left:150px;margin-bottom:6px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.wt{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.wt th,.wt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.wt th{background:var(--pen-soft);font-weight:600;font-size:12.5px;color:var(--ink);padding:9px 8px}
.wt tr:last-child td,.wt tr:last-child th{border-bottom:none}
.wt th:last-child,.wt td:last-child{border-right:none}
.wt tbody th{width:170px;background:transparent}
.wt textarea{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px;min-height:58px;resize:vertical;line-height:1.4;font-size:13.5px}
.wt textarea:focus{border-color:var(--pen);background:var(--sheet);outline:none}
.wt input{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;background:var(--sheet);font-weight:600}
@media (max-width:720px){
  table.wt.stack{min-width:0}
  .wt.stack thead{display:none}
  .wt.stack tr{display:grid;border-bottom:1px solid var(--line);padding:8px}
  .wt.stack th,.wt.stack td{display:block;border:none;width:auto;padding:3px 0}
  .wt.stack tbody th{font-size:14px;padding-bottom:6px}
  .wt.stack td::before{content:attr(data-l);display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
  .wt.stack textarea{border-color:var(--line);min-height:48px}
}

/* list */
.lst{display:grid;gap:7px;counter-reset:li}
.lst-it{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;counter-increment:li}
.lst-it::before{content:counter(li);font-family:var(--f-hand);font-size:22px;color:var(--pen);text-align:center;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:13px;color:var(--ink-2)}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.on{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.chip.hint::before{content:"+ ";opacity:.7}
.chip.used{opacity:.45}

/* repeater */
.rep{display:grid;gap:12px}
.rep-it{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;display:grid;gap:10px}
.rep-hd{display:flex;align-items:center;justify-content:space-between;font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.rep-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rep-g .wide{grid-column:1/-1}
.rep.compact .rep-it{padding:8px 10px;gap:6px}
.rep-total{font-size:13.5px;color:var(--ink-2)}
.rep-total b{font-family:var(--f-display);color:var(--ink)}
.cslot{display:grid;gap:6px}

/* score */
.score{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.score-it{display:grid;grid-template-columns:minmax(0,1fr) 170px 58px;gap:12px;align-items:center;font-size:14px}
.score-it input[type=range]{width:100%;accent-color:var(--pen)}
.score-v{font:600 14px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.score-tot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-weight:600}
.score-tot b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}

.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--ok)}

/* swot & quads */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q{border-radius:var(--r);padding:12px;display:grid;gap:8px;border:1px solid var(--line);background:var(--panel)}
.q h3{font-size:13px;display:flex;align-items:baseline;gap:8px}
.q h3 span{font-size:26px;line-height:1}
.q p{margin:0;font-size:12.5px;color:var(--ink-3)}
.q.s h3 span{color:var(--ok)} .q.w h3 span{color:var(--bad)} .q.o h3 span{color:var(--pen)} .q.t h3 span{color:var(--warn)}
.quad2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* rating */
.rate{display:grid;gap:8px}
.rate-row{display:grid;grid-template-columns:minmax(0,200px) repeat(3,minmax(0,1fr));gap:10px;align-items:center;font-size:13.5px}
.rate-hd{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;justify-content:center}
.dots button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--panel);font-size:11px;color:var(--ink-3);padding:0}
.dots button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.rate-sum{font:600 14px var(--f-display);text-align:center}
.rate-sum.best{color:var(--ok)}

/* emotions */
.emo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.emo-it{display:grid;gap:6px}
.emo-n{display:flex;align-items:center;gap:8px;font:600 13px var(--f-display)}
.emo-n i{width:14px;height:14px;border-radius:50%;background:var(--c)}

/* stairs */
.stairs{display:grid;gap:8px}
.stair{display:grid;grid-template-columns:auto minmax(0,1fr) 150px auto;gap:8px;align-items:center}
.stair-n{font:700 12px var(--f-display);background:var(--pen);color:var(--pen-ink);border-radius:8px;padding:6px 10px;white-space:nowrap}

/* ai feedback */
.fb{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pen);border-radius:var(--r);padding:14px 16px;white-space:pre-wrap;font-size:14px;max-width:80ch}
.fb .fb-h{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--pen);margin-bottom:6px;white-space:normal}

/* card picker modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--sheet);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(980px,100%);max-height:calc(100vh - 32px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.modal-hd{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.modal-hd h2{font-size:17px}
.modal-bd{overflow:auto;padding:16px 18px}
.modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cgroup-h{font:600 12px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:6px 0 10px;grid-column:1/-1}
.card-big{width:min(460px,100%)}
.card-big .sc{min-height:180px;padding:18px}
.card-big .sc .sc-t{font-size:17px}
.card-big .sc .sc-d{font-size:14px}
.cb-sec{margin-top:14px;font-size:14px}
.cb-sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
.cb-sec ul,.cb-sec ol{margin:0;padding-left:20px;display:grid;gap:4px}
.cb-task{background:var(--sticky);color:var(--sticky-ink);border-radius:4px 4px 14px 4px;padding:10px 12px;font-style:italic}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lnk{border:none;border-radius:7px;padding:3px 8px;font:600 11.5px var(--f-display);color:#fff;background:linear-gradient(140deg,var(--g1),var(--g2))}

/* home */
.hero{display:grid;gap:14px;max-width:780px}
.hero h1{font-size:clamp(26px,4vw,40px);line-height:1.08}
.hero p{margin:0;color:var(--ink-2);font-size:16px;max-width:66ch}
.hand{font-family:var(--f-hand);font-size:24px;color:var(--pen);line-height:1}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin-top:26px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start}
.box h2{font-size:15px}
.mod-p{display:grid;gap:6px}
.mod-p .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mod-p .bar i{display:block;height:100%;background:var(--pen);border-radius:99px}
.mod-p .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.mod-p .t b{font-weight:600}
.mod-p .t span{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.how{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px;color:var(--ink-2)}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.how li b{font-family:var(--f-hand);font-size:24px;color:var(--pen);line-height:1;font-weight:400}
.deck-strip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-top:4px}
.deck-strip a{height:56px;border-radius:8px;background:linear-gradient(140deg,var(--g1),var(--g2));display:flex;align-items:flex-end;padding:5px;color:#fff;font:600 8.5px/1.1 var(--f-display);text-transform:uppercase;text-decoration:none;letter-spacing:.02em;overflow:hidden}

.crit-total{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crit-total .big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.crit-total .of{color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;box-shadow:var(--shadow)}

@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{display:none;position:fixed;inset:0;top:0;max-height:none;z-index:50;background:var(--paper);padding:calc(70px + env(safe-area-inset-top,0px)) 16px 40px;overflow:auto}
  .nav.open{display:block}
  .menu-btn{display:inline-flex}
  .rank-wrap{grid-template-columns:minmax(0,1fr)}
  .home-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .top .ring span,.pill .ptxt{display:none}
  .top-in{gap:8px}
  .brand-t span{display:none}
  .ring{display:none}
  .sheet{padding:20px 14px 28px 36px;border-radius:12px}
  .sheet::before{left:24px}
  .act-num{font-size:20px;left:0;width:22px;top:20px}
  .mm{grid-template-columns:minmax(0,1fr)}
  .mm-c{margin-bottom:10px}
  .mm-branches{padding-left:14px}
  .mm-b{grid-template-columns:minmax(0,1fr) auto}
  .mm-b>textarea{grid-column:1/-1}
  .mm-b::before{left:-14px;width:12px}
  .mm-head{display:none}
  .picked-it{grid-template-columns:minmax(0,1fr)}
  .swot,.quad2{grid-template-columns:minmax(0,1fr)}
  .emo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .score-it{grid-template-columns:minmax(0,1fr) 54px}
  .score-it input{grid-column:1/-1;grid-row:2}
  .rate-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
  .rate-row>:first-child{grid-column:1/-1}
  .dots button{width:20px;height:20px}
  .stair{grid-template-columns:minmax(0,1fr) auto}
  .stair-n{grid-column:1/-1;justify-self:start}
  .deck-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#home"><span class="brand-mark">S</span><span class="brand-t" id="brand-t"><b>Рабочая тетрадь Scaffold</b><span>Проектирование учебных занятий · НАО «Talap»</span></span></a>
  <span class="sp"></span>
  <span class="ring" id="ring"></span>
  <span class="pill" id="save" role="status"></span>
  <div class="seg" id="lang" role="group" aria-label="Язык / Тіл"><button type="button" data-l="ru">РУС</button><button type="button" data-l="kk">ҚАЗ</button></div>
  <button class="theme-btn" id="theme" type="button"></button>
  <button class="menu-btn" id="menu" type="button" aria-controls="nav">Содержание</button>
</div></header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Содержание тетради"></nav>
  <main id="main"></main>
</div>

  // Методы оценки
  C('as1','as','Обратная связь от сверстников','Обучающиеся дают и получают обратную связь от сверстников о том, на каком этапе обучения они находятся и какие следующие шаги можно предпринять для дальнейшего прогресса.',{tips:['Создайте обучающимся возможность часто давать и получать отзывы о работе друг друга.','Научитесь воспринимать критику и давать конструктивную обратную связь, способствующую развитию мышления роста и критического мышления.','Используйте обратную связь, чтобы сделать обучение наглядным, и опишите желаемые результаты.']}),
  C('as2','as','Самоанализ','Обучающиеся анализируют обратную связь и фактические данные, чтобы оценить себя в соответствии с установленными критериями оценки.',{tips:['Предоставляйте обучающимся регулярные возможности для выражения суждений о своих достижениях и результатах обучения.','Поддерживайте обучающихся в определении методов обратной связи, стандартов и/или критериев для применения в их работе.','Обучайте подтверждать свою компетентность различными способами для развития навыков рефлексии.']}),
  C('as3','as','Формирование оценочных данных','Обучающиеся используют разные медиатехнологии, позволяющие им предоставить доказательства и подтверждать свою компетенцию, выступая перед различными аудиториями и убеждая в этом.',{tips:['Поддерживайте обучающихся в определении необходимых доказательств для демонстрации усвоенного материала.','Предоставляйте обучающимся возможность свободного выбора и гибкость в организации своего обучения.','Используйте онлайн-инструменты и ресурсы (например, интерактивные веб-инструменты, социальные сети) в качестве хранилища доказательств.']}),
  C('as4','as','Аутентичная оценка','Обучающиеся применяют полученные знания в конкретных, важных и значимых обстоятельствах или ситуациях, соответствующих реальным ожиданиям в конкретном контексте или сфере деятельности, с участием реальных заинтересованных сторон.',{tips:['Связывайте оценку с реальными вопросами, проблемами и применением.','Используйте симуляционные и ролевые игры.','Предоставляйте обучающимся разнообразные способы получения обратной связи для совершенствования их работы.']}),
  C('as5','as','Автоматизированная оценка','Обучающиеся могут получить доступ к оцениванию в цифровом формате, который включает в себя функции обратной связи, отчётности и/или портфолио.',{tips:['Используйте функции обратной связи для получения конструктивной оценки или постановки дальнейших задач, определяющих направления для дополнительного обучения.','Адаптируйте преподавание или обучение к потребностям обучающихся, используя своевременную обратную связь.','Создавайте мультимедийные сценарии из реальной жизни, позволяющие наглядно продемонстрировать компетенции.']}),
  C('as6','as','Наблюдение','Наблюдение за обучающимися в действии с использованием различных методов для отслеживания их достижений, заинтересованности, компетенции, сильных сторон и потребностей.',{tips:['Составьте и следуйте плану наблюдения, включающего различные методы.','Документируйте свои наблюдения, собрав доказательства, чтобы использовать их в работе с обучающимися для анализа компетенций.','Периодически проводите наблюдения, фиксируя результаты.']}),
  C('as7','as','Учебные вопросы','Использование вопросов способствует установлению взаимопонимания и доверия, побуждая обучающихся обмениваться идеями, исследовать и совершенствовать мышление, повышать эффективность работы для подтверждения развития компетенций.',{tips:['Задавайте открытые вопросы, способствующие вовлечённости и активному обучению.','Задавайте вопросы в последовательности, обеспечивающей их глубину и сложность.','Обучайте постоянно задавать критические и сложные вопросы себе и другим.']}),

  C('tm3','tm','Педагогика создания ценностей','Обучающиеся учатся, применяя свои компетенции для создания чего-либо ценного по крайней мере для одной заинтересованной стороны вне их группы, класса или колледжа. Ценность может быть экономической, социальной или культурной.',{steps:['Обучающиеся анализируют, кому может быть полезно их обучение.','Выявляют возможности создания ценности для других.','Решают, как будут создавать ценность, и предпринимают действия.','Используют обратную связь от бенефициаров для совершенствования работы.','Анализируют свой опыт обучения.']}),

  C('tm5','tm','Обучение в игровой форме','Обучающихся поощряют заниматься творчеством, исследовать, быть активными и погружаться в обучение, чтобы стимулировать внутреннюю мотивацию и «состояние потока».',{steps:['Обучающиеся получают поддержку, чтобы учиться на ошибках в безопасном пространстве.','Участвуют в игровой деятельности, направленной на обучение.','Понимают учебную цель деятельности.','Эмоционально вовлечены в процесс обучения.','Представляют себе устойчивое будущее и по-новому формулируют проблемы.']}),
  C('tm6','tm','Лабораторный метод обучения','Обучающиеся получают знания через практический опыт экспериментов методом проб и ошибок с предметами, материалами и явлениями, где они могут наблюдать, практиковаться и тестировать решения.',{steps:['Обучающиеся экспериментируют, используя доступные ресурсы.','Учатся, создавая.','Учатся на неудачах и ошибках.','Документируют свою лабораторную практику.','Анализируют свой опыт обучения.']}),
  C('tm7','tm','Сервисное обучение','Обучающиеся воплощают свои идеи в действия для удовлетворения реальных потребностей своего местного сообщества.',{steps:['Обучающиеся взаимодействуют со своими сообществами и выявляют потребности.','Изучают возможности создания ценности для сообщества.','Предпринимают действия по созданию ценности.','Учитывают отзывы бенефициаров.','Наглядно демонстрируют полученные знания и поощряют достигнутый прогресс.']}),

let _vctx=null;
function vmeasure(t,size,weight=400){ if(!_vctx){ _vctx=document.createElement('canvas').getContext('2d'); } _vctx.font=`${weight} ${size}px ${VFONT}`; return _vctx.measureText(t).width; }
function vwrap(text,maxW,size,weight=400){
  const out=[]; String(text||'').split(/\n/).forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean); let line='';
    words.forEach(w=>{ const t=line?line+' '+w:w;
      if(vmeasure(t,size,weight)<=maxW) line=t;
      else { if(line) out.push(line); // break long word
        while(vmeasure(w,size,weight)>maxW && w.length>1){ let i=w.length; while(i>1 && vmeasure(w.slice(0,i)+'-',size,weight)>maxW) i--; out.push(w.slice(0,i)+'-'); w=w.slice(i); }
        line=w; } });
    if(line) out.push(line); });
  return out.length?out:[''];
}
const vx=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function vtext(lines,x,y,size,{weight=400,fill=VP.ink,anchor='start',lh=1.28,italic=false}={}){
  return `<text x="${x}" y="${y}" font-family='${VFONT}' font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}"${italic?' font-style="italic"':''}>`+lines.map((l,i)=>`<tspan x="${x}" dy="${i?size*lh:0}">${vx(l)}</tspan>`).join('')+'</text>';
}
function vsvg(w,h,body){ return {w,h,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${VP.paper}"/>${body}</svg>`}; }

function vizStairs(order){
  const W=880, n=7, pad=20, gap=8, colW=(W-pad*2-gap*(n-1))/n, step=30, fs=12;
  const items=order.map(i=>({i,lines:vwrap(T(PRINCIPLES[i]),colW-18,fs)}));
  const textH=Math.max(...items.map(it=>it.lines.length))*fs*1.28;
  const baseH=56+textH+14, H=pad*2+baseH+step*(n-1)+26;
  let b=''; const bottom=H-pad-26;
  // columns: left = lowest priority (rank 7) ... right = rank 1
  for(let j=0;j<n;j++){
    const rank=n-j, it=items[rank-1]; const col=VCOL[it.i%VCOL.length];
    const x=pad+j*(colW+gap), top=bottom-(baseH+j*step);
    b+=`<rect x="${x}" y="${top}" width="${colW}" height="${bottom-top}" rx="8" fill="${tint(col,.16)}"/>`;
    b+=`<rect x="${x}" y="${top}" width="${colW}" height="8" rx="4" fill="${col}"/>`;
    b+=`<circle cx="${x+22}" cy="${top+32}" r="15" fill="${col}"/>`+vtext([String(rank)],x+22,top+37,15,{weight:700,fill:'#fff',anchor:'middle'});
    b+=vtext([T('П')+(it.i+1)],x+44,top+37,12,{weight:700,fill:col});
    b+=vtext(it.lines,x+9,top+64,fs,{fill:VP.ink});
  }
  b+=`<line x1="${pad}" y1="${bottom+10}" x2="${W-pad-14}" y2="${bottom+10}" stroke="${VP.line}" stroke-width="2"/><path d="M${W-pad-14} ${bottom+4} L${W-pad} ${bottom+10} L${W-pad-14} ${bottom+16} Z" fill="${VP.line}"/>`;
  b+=vtext([T('ниже приоритет')],pad,bottom+24,11,{fill:VP.muted})+vtext([T('выше приоритет')],W-pad,bottom+24,11,{fill:VP.muted,anchor:'end'});
  return vsvg(W,H,b);
}

  const top=pad+26; let y=top; rows.forEach(r=>{ r.y=y; y+=r.h+14; });

  rows.forEach(r=>{
    const cy=r.y+r.h/2, x0=pad+cW, x1=colX[0];

    r.t.forEach((lines,i)=>{ const x=colX[i], w=cols[i], s=stl[i];
      if(i>0) b+=`<line x1="${colX[i-1]+cols[i-1]}" y1="${cy}" x2="${x}" y2="${cy}" stroke="${s.s}" stroke-width="2"/>`;

}

  const target=(x,y)=>`<circle cx="${x}" cy="${y}" r="24" fill="#fff"/><circle cx="${x}" cy="${y}" r="17" fill="#e0565b"/><circle cx="${x}" cy="${y}" r="10" fill="#fff"/><circle cx="${x}" cy="${y}" r="4.5" fill="#e0565b"/><path d="M${x+4} ${y-4} L${x+22} ${y-22}" stroke="#fff" stroke-width="3"/>`;
  const stairs=(x,y)=>`<circle cx="${x}" cy="${y}" r="24" fill="#fff"/><path d="M${x-14} ${y+12} h8 v-8 h8 v-8 h8 v-8 h4" fill="none" stroke="${VP.pen}" stroke-width="3.5" stroke-linejoin="round"/>`;
  b+=panel(pad,T('Краткосрочные цели'),'#e0565b',target,A);
  b+=panel(pad+colW+gap,T('Долгосрочные цели'),VP.pen,stairs,B);
  return vsvg(W,H,b);
}

const KK={"Задание": "Тапсырма", "Планирование": "Жоспарлау", "Сквозные компетенции": "Икемді құзыреттер", "Сквозные": "Икемді", "Методы оценки": "Бағалау әдістері", "Метод оценки": "Бағалау әдісі", "Методы обучения": "Оқыту әдістері", "Метод обучения": "Оқыту әдісі", "Цифровые компетенции (DigComp)": "Цифрлық құзыреттер (DigComp)", "Предпринимательские компетенции (EntreComp)": "Кәсіпкерлік құзыреттер (EntreComp)", "Компетенции устойчивого развития (GreenComp)": "Тұрақты даму құзыреттері (GreenComp)", "Личностные, социальные и «Умение обучаться» (LifeComp)": "Тұлғалық, әлеуметтік құзыреттер және «Оқуға қабілеттілік» (LifeComp)", "Длительность": "Ұзақтығы", "Сколько времени будет длиться занятие?": "Сабақ қанша уақытқа созылады?", "Цель": "Мақсат", "Какова цель занятия?": "Сабақтың мақсаты қандай?", "Тема": "Тақырып", "Какому разделу учебной программы будет посвящено данное занятие?": "Сабақ оқу бағдарламасының қай бөліміне арналады?", "Целевая аудитория": "Мақсатты аудитория", "Кто будет обучаться? Сколько человек будет в группе?": "Кім оқиды? Топта неше адам болады?", "Потребности": "Қажеттіліктер", "На какие потребности обучающихся будет направлена работа? Общие или специфические потребности?": "Жұмыс білім алушылардың қандай қажеттіліктеріне бағытталады? Жалпы ма, әлде ерекше қажеттіліктер ме?", "Ресурсы": "Ресурстар", "Какие ресурсы/люди необходимы для осуществления деятельности?": "Іс-әрекетті жүзеге асыру үшін қандай ресурстар/адамдар қажет?", "Место": "Орын", "Где будет проходить занятие?": "Сабақ қай жерде өтеді?", "Связь с реальной жизнью": "Нақты өмірмен байланыс", "Имеется ли взаимосвязь с реальным миром? Какие жизненные проблемы будут рассмотрены?": "Нақты әлеммен өзара байланыс бар ма? Қандай өмірлік мәселелер қарастырылады?", "Выберите компетенции": "Құзыреттерді таңдаңыз", "Над какими компетенциями будут работать обучающиеся? Выберите из карточек компетенции и поместите их сюда.": "Білім алушылар қандай құзыреттермен жұмыс істейді? Карталардан құзыреттерді таңдап, осы жерге орналастырыңыз.", "Определите уровень компетенции": "Құзырет деңгейін анықтаңыз", "Каков уровень подготовки обучающихся? Выберите метод оценки их начального уровня среди карточек «Методы оценки».": "Білім алушылардың дайындық деңгейі қандай? «Бағалау әдістері» карталарынан олардың бастапқы деңгейін бағалау әдісін таңдаңыз.", "Выберите метод обучения": "Оқыту әдісін таңдаңыз", "Каким образом вы собираетесь преподавать? Выберите одну или несколько карточек среди карточек «Методы обучения».": "Сіз қалай оқытпақсыз? «Оқыту әдістері» карталарынан бір немесе бірнеше картаны таңдаңыз.", "Ожидаемые результаты / индикаторы": "Күтілетін нәтижелер / көрсеткіштер", "Определите, чего бы вы хотели, чтобы ваши обучающиеся достигли, сделали, произвели? Что будет являться конечным результатом?": "Білім алушыларыңыздың нені меңгергенін, жасағанын, өндіргенін қалайсыз? Түпкі нәтиже не болады?", "Выберите метод оценки": "Бағалау әдісін таңдаңыз", "Как вы будете оценивать прогресс обучающихся? Выберите одну из карточек «Методы оценки».": "Білім алушылардың ілгерілеуін қалай бағалайсыз? «Бағалау әдістері» карталарының бірін таңдаңыз.", "Сбор ресурсов": "Ресурстарды жинау", "Подготовьте необходимые ресурсы и привлеките соответствующих людей. Есть ли у вас всё необходимое?": "Қажетті ресурстарды дайындап, тиісті адамдарды тартыңыз. Сізде барлығы бар ма?", "Хронология": "Хронология", "Как будет проходить занятие? Запишите план и хронологию учебного занятия.": "Сабақ қалай өтеді? Оқу сабағының жоспары мен хронологиясын жазыңыз.", "Критическое мышление": "Сыни ойлау", "Концептуализация, анализ, синтез и оценка информации для выработки обоснованных выводов, создания инновационных решений или принятия мер.": "Негізделген қорытындылар жасау, инновациялық шешімдер құру немесе шара қабылдау үшін ақпаратты тұжырымдау, талдау, синтездеу және бағалау.", "Решение проблем": "Мәселелерді шешу", "Размышление, понимание и решение сложных проблем или ситуаций, когда нет быстрого решения.": "Жылдам шешімі жоқ күрделі мәселелер мен жағдайларды ой елегінен өткізу, түсіну және шешу.", "Работа в команде": "Командада жұмыс", "Оперативная и эффективная работа и взаимодействие в группе, созданной разными людьми, для достижения общих или совместных целей.": "Ортақ немесе бірлескен мақсаттарға жету үшін әртүрлі адамдардан құралған топта жедел әрі тиімді жұмыс істеу және өзара әрекеттесу.", "Навыки коммуникации и переговоров": "Коммуникация және келіссөз дағдылары", "Эффективное донесение информации и идей различным аудиториям. Установление диалога и совместная работа с другими сторонами для достижения приемлемого решения для всех участников.": "Ақпарат пен идеяларды әртүрлі аудиторияға тиімді жеткізу. Барлық қатысушыларға қолайлы шешімге жету үшін басқа тараптармен диалог орнату және бірлесіп жұмыс істеу.", "Аналитические навыки": "Талдау дағдылары", "Разделение информации и данных на более простые и управляемые компоненты для получения выводов.": "Қорытынды жасау үшін ақпарат пен деректерді қарапайым әрі басқарылатын құрамдас бөліктерге бөлу.", "Креативность": "Шығармашылық", "Формирование креативных и целенаправленных идей для создания ценных результатов.": "Құнды нәтижелер жасау үшін шығармашылық және мақсатты идеяларды қалыптастыру.", "Навыки межкультурного общения": "Мәдениетаралық қарым-қатынас дағдылары", "Эффективное и соответствующее взаимодействие в различных межкультурных ситуациях, мобилизация соответствующих установок, знаний, навыков и ценностей.": "Әртүрлі мәдениетаралық жағдайларда тиісті көзқарастарды, білімді, дағдылар мен құндылықтарды жұмылдыра отырып, тиімді және орынды өзара әрекеттесу.", "Обратная связь от сверстников": "Құрдастардың кері байланысы", "Обучающиеся дают и получают обратную связь от сверстников о том, на каком этапе обучения они находятся и какие следующие шаги можно предпринять для дальнейшего прогресса.": "Білім алушылар оқудың қай кезеңінде екені және әрі қарай ілгерілеу үшін қандай келесі қадамдар жасауға болатыны туралы құрдастарынан кері байланыс береді және алады.", "Создайте обучающимся возможность часто давать и получать отзывы о работе друг друга.": "Білім алушыларға бір-бірінің жұмысы туралы жиі пікір беріп, алуға мүмкіндік жасаңыз.", "Научитесь воспринимать критику и давать конструктивную обратную связь, способствующую развитию мышления роста и критического мышления.": "Сынды қабылдауға және өсу ойлауы мен сыни ойлаудың дамуына ықпал ететін сындарлы кері байланыс беруге үйреніңіз.", "Используйте обратную связь, чтобы сделать обучение наглядным, и опишите желаемые результаты.": "Оқуды көрнекі ету үшін кері байланысты пайдаланыңыз және қалаған нәтижелерді сипаттаңыз.", "Самоанализ": "Өзін-өзі тексеру", "Обучающиеся анализируют обратную связь и фактические данные, чтобы оценить себя в соответствии с установленными критериями оценки.": "Білім алушылар белгіленген бағалау критерийлеріне сәйкес өздерін бағалау үшін кері байланыс пен нақты деректерді талдайды.", "Предоставляйте обучающимся регулярные возможности для выражения суждений о своих достижениях и результатах обучения.": "Білім алушыларға өз жетістіктері мен оқу нәтижелері туралы пікір білдіруге тұрақты мүмкіндік беріңіз.", "Поддерживайте обучающихся в определении методов обратной связи, стандартов и/или критериев для применения в их работе.": "Білім алушыларға өз жұмысында қолданатын кері байланыс әдістерін, стандарттарды және/немесе критерийлерді анықтауда қолдау көрсетіңіз.", "Обучайте подтверждать свою компетентность различными способами для развития навыков рефлексии.": "Рефлексия дағдыларын дамыту үшін өз құзыреттілігін әртүрлі тәсілдермен растауға үйретіңіз.", "Формирование оценочных данных": "Бағалау деректерін қалыптастыру", "Обучающиеся используют разные медиатехнологии, позволяющие им предоставить доказательства и подтверждать свою компетенцию, выступая перед различными аудиториями и убеждая в этом.": "Білім алушылар әртүрлі аудиториялар алдында сөз сөйлеп, оларды сендіре отырып, дәлел ұсынуға және өз құзыретін растауға мүмкіндік беретін түрлі медиатехнологияларды пайдаланады.", "Поддерживайте обучающихся в определении необходимых доказательств для демонстрации усвоенного материала.": "Білім алушыларға меңгерілген материалды көрсету үшін қажетті дәлелдерді анықтауда қолдау көрсетіңіз.", "Предоставляйте обучающимся возможность свободного выбора и гибкость в организации своего обучения.": "Білім алушыларға оқуын ұйымдастыруда еркін таңдау мен икемділік мүмкіндігін беріңіз.", "Используйте онлайн-инструменты и ресурсы (например, интерактивные веб-инструменты, социальные сети) в качестве хранилища доказательств.": "Дәлелдер қоймасы ретінде онлайн-құралдар мен ресурстарды (мысалы, интерактивті веб-құралдар, әлеуметтік желілер) пайдаланыңыз.", "Аутентичная оценка": "Шынайы бағалау", "Обучающиеся применяют полученные знания в конкретных, важных и значимых обстоятельствах или ситуациях, соответствующих реальным ожиданиям в конкретном контексте или сфере деятельности, с участием реальных заинтересованных сторон.": "Білім алушылар алған білімдерін нақты мүдделі тараптардың қатысуымен белгілі бір контекстегі немесе қызмет саласындағы нақты күтулерге сәйкес келетін нақты, маңызды және мәнді жағдайларда қолданады.", "Связывайте оценку с реальными вопросами, проблемами и применением.": "Бағалауды нақты сұрақтармен, мәселелермен және қолданумен байланыстырыңыз.", "Используйте симуляционные и ролевые игры.": "Симуляциялық және рөлдік ойындарды пайдаланыңыз.", "Предоставляйте обучающимся разнообразные способы получения обратной связи для совершенствования их работы.": "Білім алушыларға жұмысын жетілдіру үшін кері байланыс алудың әртүрлі тәсілдерін ұсыныңыз.", "Автоматизированная оценка": "Автоматтандырылған бағалау", "Обучающиеся могут получить доступ к оцениванию в цифровом формате, который включает в себя функции обратной связи, отчётности и/или портфолио.": "Білім алушылар кері байланыс, есеп беру және/немесе портфолио функцияларын қамтитын цифрлық форматтағы бағалауға қол жеткізе алады.", "Используйте функции обратной связи для получения конструктивной оценки или постановки дальнейших задач, определяющих направления для дополнительного обучения.": "Сындарлы бағалау алу немесе қосымша оқыту бағыттарын айқындайтын келесі міндеттерді қою үшін кері байланыс функцияларын пайдаланыңыз.", "Адаптируйте преподавание или обучение к потребностям обучающихся, используя своевременную обратную связь.": "Уақтылы кері байланысты пайдалана отырып, оқытуды немесе оқуды білім алушылардың қажеттіліктеріне бейімдеңіз.", "Создавайте мультимедийные сценарии из реальной жизни, позволяющие наглядно продемонстрировать компетенции.": "Құзыреттерді көрнекі түрде көрсетуге мүмкіндік беретін нақты өмірден алынған мультимедиялық сценарийлер жасаңыз.", "Наблюдение": "Бақылау", "Наблюдение за обучающимися в действии с использованием различных методов для отслеживания их достижений, заинтересованности, компетенции, сильных сторон и потребностей.": "Білім алушылардың жетістіктерін, қызығушылығын, құзыретін, күшті жақтары мен қажеттіліктерін қадағалау үшін әртүрлі әдістерді қолдана отырып, оларды іс-әрекет үстінде бақылау.", "Составьте и следуйте плану наблюдения, включающего различные методы.": "Әртүрлі әдістерді қамтитын бақылау жоспарын құрып, соны ұстаныңыз.", "Документируйте свои наблюдения, собрав доказательства, чтобы использовать их в работе с обучающимися для анализа компетенций.": "Құзыреттерді талдау үшін білім алушылармен жұмыста пайдалану мақсатында дәлелдер жинап, бақылауларыңызды құжаттаңыз.", "Периодически проводите наблюдения, фиксируя результаты.": "Нәтижелерді тіркей отырып, мезгіл-мезгіл бақылау жүргізіп отырыңыз.", "Учебные вопросы": "Зерттеуге арналған сұрақтар", "Использование вопросов способствует установлению взаимопонимания и доверия, побуждая обучающихся обмениваться идеями, исследовать и совершенствовать мышление, повышать эффективность работы для подтверждения развития компетенций.": "Сұрақтарды қолдану өзара түсіністік пен сенім орнатуға ықпал етеді, білім алушыларды идеялармен алмасуға, ойлауын зерттеуге және жетілдіруге, құзыреттердің дамуын растау үшін жұмыс тиімділігін арттыруға ынталандырады.", "Задавайте открытые вопросы, способствующие вовлечённости и активному обучению.": "Қатысуға және белсенді оқуға ықпал ететін ашық сұрақтар қойыңыз.", "Задавайте вопросы в последовательности, обеспечивающей их глубину и сложность.": "Сұрақтарды олардың тереңдігі мен күрделілігін қамтамасыз ететін ретпен қойыңыз.", "Обучайте постоянно задавать критические и сложные вопросы себе и другим.": "Өзіне және басқаларға үнемі сыни әрі күрделі сұрақтар қоюға үйретіңіз.", "Проектно-ориентированное обучение": "Жобаға бағытталған оқыту", "Обучающиеся развивают знания и навыки через проекты, основанные на реальных вызовах и проблемах, которые имеют значение для них, что придаёт обучению целенаправленность и стимулирует самостоятельность обучающихся.": "Білім алушылар өздері үшін маңызды нақты сын-қатерлер мен мәселелерге негізделген жобалар арқылы білім мен дағдыларын дамытады, бұл оқуға мақсаттылық береді және білім алушылардың дербестігін ынталандырады.", "Обучающиеся определяют и формулируют реальную проблему, вопрос или задачу.": "Білім алушылар нақты мәселені, сұрақты немесе міндетті анықтап, тұжырымдайды.", "Определяют и составляют последовательность заданий для проведения долгосрочного исследования.": "Ұзақ мерзімді зерттеу жүргізу үшін тапсырмаларды анықтап, олардың ретін құрады.", "Генерируют и оценивают идеи.": "Идеяларды ұсынады және бағалайды.", "Создают продукт для тестирования, доработки и презентации своей работы.": "Жұмысын сынау, жетілдіру және таныстыру үшін өнім жасайды.", "Рефлексируют и подводят итоги обучения.": "Рефлексия жасап, оқу қорытындысын шығарады.", "Личностно-ориентированное обучение": "Тұлғаға бағытталған оқыту", "Обучающиеся активно делятся своим опытом, чтобы сделать обучение актуальным, целенаправленным и значимым для своих индивидуальных потребностей, интересов, опыта и амбиций.": "Білім алушылар оқуды өздерінің жеке қажеттіліктеріне, қызығушылықтарына, тәжірибесі мен ұмтылыстарына өзекті, мақсатты әрі маңызды ету үшін өз тәжірибесімен белсенді бөліседі.", "Обучающиеся определяют темы или проблемы для изучения.": "Білім алушылар зерттеуге арналған тақырыптарды немесе мәселелерді анықтайды.", "Определяют предпочтительные методы обучения и оценки.": "Оқыту мен бағалаудың өздеріне ұнайтын әдістерін анықтайды.", "Определяют личные цели развития компетенций.": "Құзыреттерді дамытудың жеке мақсаттарын анықтайды.", "Определяют способы отбора, применения и оценки компетенций при выполнении конкретных задач.": "Нақты міндеттерді орындау кезінде құзыреттерді іріктеу, қолдану және бағалау тәсілдерін анықтайды.", "Им оказывается поддержка в соотнесении компетенций с различными целями и контекстами.": "Құзыреттерді әртүрлі мақсаттар мен контекстермен сәйкестендіруде оларға қолдау көрсетіледі.", "Педагогика создания ценностей": "Құндылыққа негізделген педагогика", "Обучающиеся учатся, применяя свои компетенции для создания чего-либо ценного по крайней мере для одной заинтересованной стороны вне их группы, класса или колледжа. Ценность может быть экономической, социальной или культурной.": "Білім алушылар өз құзыреттерін тобынан, сыныбынан немесе колледжінен тыс кемінде бір мүдделі тарап үшін құнды нәрсе жасауға қолдана отырып оқиды. Құндылық экономикалық, әлеуметтік немесе мәдени болуы мүмкін.", "Обучающиеся анализируют, кому может быть полезно их обучение.": "Білім алушылар өз оқуының кімге пайдалы болуы мүмкін екенін талдайды.", "Выявляют возможности создания ценности для других.": "Басқалар үшін құндылық жасау мүмкіндіктерін анықтайды.", "Решают, как будут создавать ценность, и предпринимают действия.": "Құндылықты қалай жасайтынын шешіп, іс-әрекетке кіріседі.", "Используют обратную связь от бенефициаров для совершенствования работы.": "Жұмысын жетілдіру үшін бенефициарлардан кері байланысты пайдаланады.", "Анализируют свой опыт обучения.": "Өзінің оқу тәжірибесін талдайды.", "Обучение в сотрудничестве": "Ынтымақтастықта оқыту", "Обучающиеся получают знания друг от друга, учитывая различные точки зрения, потребности и предпочтения в обучении, чтобы мотивировать и поддерживать друг друга в достижении более высоких результатов.": "Білім алушылар бір-бірін жоғары нәтижелерге жетуге ынталандыру және қолдау үшін әртүрлі көзқарастарды, қажеттіліктер мен оқудағы қалауларды ескере отырып, бір-бірінен білім алады.", "Обучающиеся работают в группах.": "Білім алушылар топпен жұмыс істейді.", "Определяют/получают индивидуальные и групповые цели.": "Жеке және топтық мақсаттарды анықтайды/алады.", "Совместно работают над созданием решений.": "Шешімдер жасау үстінде бірлесіп жұмыс істейді.", "Вносят вклад в определение критериев успеха и общих ожиданий.": "Табыс критерийлері мен ортақ күтулерді анықтауға үлес қосады.", "«Обучают» друг друга.": "Бір-бірін «оқытады».", "Обучение в игровой форме": "Ойын арқылы оқыту", "Обучающихся поощряют заниматься творчеством, исследовать, быть активными и погружаться в обучение, чтобы стимулировать внутреннюю мотивацию и «состояние потока».": "Ішкі мотивация мен оқудағы «ағын күйін» ынталандыру үшін білім алушыларды шығармашылықпен айналысуға, зерттеуге, белсенді болуға және оқуға терең енуге ынталандырады.", "Обучающиеся получают поддержку, чтобы учиться на ошибках в безопасном пространстве.": "Білім алушылар қауіпсіз ортада қателіктерден үйренуге қолдау алады.", "Участвуют в игровой деятельности, направленной на обучение.": "Оқытуға бағытталған ойын әрекетіне қатысады.", "Понимают учебную цель деятельности.": "Іс-әрекеттің оқу мақсатын түсінеді.", "Эмоционально вовлечены в процесс обучения.": "Оқу процесіне эмоционалды түрде тартылған.", "Представляют себе устойчивое будущее и по-новому формулируют проблемы.": "Тұрақты болашақты елестетіп, мәселелерді жаңаша тұжырымдайды.", "Лабораторный метод обучения": "Оқытудың зертханалық әдісі", "Обучающиеся получают знания через практический опыт эксперименто ындықтар мен уақытша сәтсіздіктерге қарамастан, төзімді болу, зейінді және мақсаткерлікті сақтау, берілмеу.", "Составьте список различных стратегий самомотивации и мотивации других людей по преодолению трудностей.": "Қиындықтарды еңсеру бойынша өзін-өзі ынталандыру және басқа адамдарды ынталандыру стратегияларының тізімін жасаңыз.", "Мобилизация ресурсов": "Ресурстарды жұмылдыру", "Получение поддержки и управление материальными и нематериальными ресурсами, максимальное использование своего времени.": "Қолдау алу және материалдық және материалдық емес ресурстарды басқару, өз уақытын барынша тиімді пайдалану.", "Составьте список ресурсов, необходимых для проекта, и распределите роли.": "Жобаға қажетті ресурстардың тізімін жасап, рөлдерді бөліңіз.", "Финансовая и экономическая грамотность": "Қаржылық және экономикалық сауаттылық", "Понимание экономических и финансовых концепций для определения бюджета, поиска финансирования и создания устойчивой ценности.": "Бюджетті анықтау, қаржыландыру іздеу және тұрақты құндылық жасау үшін экономикалық және қаржылық ұғымдарды түсіну.", "Проанализируйте бизнес-модель известной компании.": "Белгілі компанияның бизнес-моделін талдаңыз.", "Мобилизация других людей": "Басқа адамдарды жұмылдыру", "Мотивация и убеждение соответствующих заинтересованных сторон для получения поддержки, эффективной коммуникации через различные средства массовой информации.": "Қолдау алу үшін тиісті мүдделі тараптарды ынталандыру және сендіру, түрлі бұқаралық ақпарат құралдары арқылы тиімді коммуникация.", "Подготовьте презентацию новой бизнес-идеи.": "Жаңа бизнес-идеяның таныстырылымын дайындаңыз.", "Проявление инициативы": "Бастамашылық таныту", "Самостоятельная работа и действия по достижению целей, реализация намеченных планов и выполнение запланированных задач.": "Мақсаттарға жету жолындағы дербес жұмыс пен әрекеттер, белгіленген жоспарларды жүзеге асыру және жоспарланған міндеттерді орындау.", "Определите первые шаги к достижению общих целей и помогайте ия над личностными ценностями, их различием между людьми и во времени, а также их соответствие ценностям устойчивого развития.": "Жеке құндылықтарға, олардың адамдар арасында және уақыт өте келе айырмашылығына, сондай-ақ тұрақты даму құндылықтарына сәйкестігіне рефлексия жасау.", "Обсудите, может ли эгоистичный человек оценить «устойчивое мышление», где общество и планета ставятся выше интересов одного человека.": "Өзімшіл адам қоғам мен планета бір адамның мүддесінен жоғары қойылатын «тұрақты ойлауды» бағалай ала ма — талқылаңыз.", "Поддержка справедливости": "Әділдікті қолдау", "Поддержка равенства и справедливости для нынешнего и будущих поколений, извлечение уроков из прошлого.": "Қазіргі және болашақ ұрпақтар үшін теңдік пен әділдікті қолдау, өткеннен сабақ алу.", "Приведите примеры экологической несправедливости (например, превращение леса в поля под посев) и обсудите способы её изменения.": "Экологиялық әділетсіздіктің мысалдарын келтіріп (мысалы, орманды егістік алқабына айналдыру), оны өзгерту жолдарын талқылаңыз.", "Охрана природы": "Табиғатты қорғау", "Уважительное отношение к потребностям и правам других видов и природы для восстановления здоровых и устойчивых экосистем.": "Сау және тұрақты экожүйелерді қалпына келтіру үшін басқа түрлердің және табиғаттың қажеттіліктері мен құқықтарына құрметпен қарау.", "Посмотрите видеоролик об интенсивном животноводстве и обсудите вопрос о благополучии животных.": "Қарқынды мал шаруашылығы туралы бейнеролик көріп, жануарлардың әл-ауқаты мәселесін талқылаңыз.", "Системное мышление": "Жүйелік ойлау", "Подход к проблеме устойчивого развития с учётом контекста для понимания того, как элементы взаимодействуют в системах.": "Элементтердің жүйелерде өзара қалай әрекеттесетінін түсіну үшін тұрақты даму мәселесіне контекстті ескере отырып қарау.", "Выберите продукт питания из своей кладовой и проследите его жизненный цикл: происхождение, условия труда фермеров, воздействие климатических изменений, упаковку, срок годности, пище ление": "Зерттеушілік ойлау", "Изучение и объединение различных дисциплин, использование творческого подхода и экспериментирование с новыми идеями или методами.": "Әртүрлі пәндерді зерттеу және біріктіру, шығармашылық тәсілді пайдалану және жаңа идеялармен немесе әдістермен тәжірибе жасау.", "Разработайте три различных решения для одной экологической проблемы.": "Бір экологиялық мәселенің үш түрлі шешімін әзірлеңіз.", "Политическая активность": "Саяси белсенділік", "Определение гражданской ответственности и подотчётности за неустойчивое поведение и требование проведения эффективной политики в области устойчивого развития.": "Тұрақсыз мінез-құлық үшін азаматтық жауапкершілік пен есептілікті анықтау және тұрақты даму саласында тиімді саясат жүргізуді талап ету.", "Узнайте, кто отвечает за переработку отходов в вашем городе и как с ними связаться.": "Қалаңызда қалдықтарды қайта өңдеуге кім жауапты екенін және олармен қалай байланысуға болатынын біліңіз.", "Коллективные действия": "Ұжымдық әрекеттер", "Требование и достижение изменений в сотрудничестве с другими.": "Басқалармен ынтымақтаса отырып өзгерістерді талап ету және оларға қол жеткізу.", "Подготовьте совместную речь для публичного выступления с просьбой о принятии рациональных мер.": "Ұтымды шаралар қабылдауды сұрап, көпшілік алдында сөйлейтін бірлескен сөз дайындаңыз.", "Индивидуальная инициатива": "Жеке бастама", "Определение собственного потенциала для устойчивого развития и активный вклад в улучшение общества и планеты.": "Тұрақты дамуға арналған өз әлеуетін анықтау және қоғам мен планетаны жақсартуға белсенді үлес қосу.", "Обдумайте и запишите повседневные практические действия, направленные на улучшение жизни вашего сообщества.": "Қауымдастығыңыздың өмірін жақсартуға бағытталған күнделікті практикалық әрекеттерді ойластырып, жазыңыз.", "Саморегуляция": "Өзін-өзі реттеу", "Развитие осознанности и управления эмоциями, мыслями и поведением.": "Эмоцияларды, ойларды және мінез-құлықты саналы түрде басқаруды дам әртүрлі әдістермен бағалау және оны көрнекі түрде көрсету", "Модуль 1. Основы технологии Scaffold": "1-модуль. Scaffold технологиясының негіздері", "Основы технологии Scaffold и её связь с компетентностным подходом. Принципы Scaffold": "Scaffold технологиясының негіздері және оның құзыреттілік тәсілімен байланысы. Scaffold қағидаттары", "Приоритеты принципов Scaffold": "Scaffold қағидаттарының басымдығы", "Индивидуально": "Жеке", "Расположите принципы Scaffold по приоритету в соответствии с вашей педагогической практикой. Результат отобразится на пирамиде.": "Scaffold қағидаттарын өзіңіздің педагогикалық тәжірибеңізге сәйкес басымдық ретімен орналастырыңыз. Нәтиже пирамидада көрсетіледі.", "Почему вы выбрали такой порядок? Какой принцип реже всего встречается в вашей практике?": "Неге осындай ретті таңдадыңыз? Тәжірибеңізде қай қағидат сирек кездеседі?", "Ментальная карта компетентностного подхода": "Құзыреттілік тәсілдің менталдық картасы", "Проанализируйте принципы компетентностного подхода и составьте ментальную карту «Влияние элементов компетентностного подхода на процесс обучения и развитие студентов».": "Құзыреттілік тәсілдің принциптерін талдаңыз және «Құзыреттілік тәсіл элементтерінің оқу үдерісіне және білім алушылардың дамуына әсері» атты менталдық картасын құрастырыңыз.", "Прочитайте описание компетентностного подхода.": "Құзыреттілік тәсілдің сипаттамасымен танысыңыз.", "Перечислите основные элементы (знания, умения, ключевые компетенции).": "Құзыреттілік тәсілдің негізгі элементтерін атаңыз (білім, білік, негізгі құзыреттер).", "Опишите, как эти элементы влияют на процесс обучения и развитие студентов.": "Бұл элементтердің оқу үдерісіне және білім алушылардың дамуына қалай әсер ететінін сипаттаңыз.", "Напишите, как этот подход готовит студентов к реальной профессиональной жизни.": "Бұл тәсіл білім алушылардың болашақ кәсіби өміріне және кәсіби қызметінде туындайтын міндеттерді шешуге қалай көмектесетінін жазыңыз.", "Компетентностный подход": "Құзыреттілік тәсіл", "Знания": "Білім", "Умения": "Білік", "Ключевые компетенции": "Негізгі құзыреттер", "Как подход помогает студентам готовиться к реальной профессиональной жизни?": "Бұл тәсіл білім алушылардың болашақ кәсіби өміріне және кәсіби қызметінде туындайтын міндеттерді шешуге қалай көмектеседі?", "Принципы Scaffold в моей практике": "Менің тәжірибемдегі Scaffold қағидаттары", "Приведите примеры взаимосвязи принципов Scaffold и компетентностного подхода из вашей педагогической практики. Оцените, как принципы Scaffold помогают формировать критическое мышление, способность решать проблемы и работать в команде.": "Өз педагогикалық тәжірибеңізден Scaffold принциптері мен құзыреттілік тәсілдің өзара байланысына мысалдар келтіріңіз. Оқыту барысында Scaffold принциптеріне бағдарлану сыни ойлау, мәселе шешу қабілеті және топпен жұмыс істеу дағдыларының қалыптасуына қалай ықпал ететінін бағалаңыз.", "<b>Пример.</b> Лабораторная работа по физике: учащиеся работают в группах, распределяют роли, сравнивают решения и защищают общий вывод. Здесь есть вовлечение в реальный учебный процесс, студентоцентрированность, содействие обучению (сильные объясняют слабым), рефлексия при защите и взаимооценке, эмоциональные триггеры (словесное одобрение), оценивание по критериям.": "<b>Мысал.</b> Физикадан зертханалық жұмыс: білім алушылар топпен жұмыс істейді, рөлдерді бөледі, шешімдерді салыстырады және ортақ қорытындыны қорғайды. Мұнда нақты оқу үдерісіне тарту, студентке бағытталғандық, оқуға жәрдемдесу (күштілері әлсіздеріне түсіндіреді), қорғау мен өзара бағалау кезіндегі рефлексия, эмоционалды триггерлер (ауызша мадақтау), критерийлер бойынша бағалау бар.", "Пример": "Мысал", "Ситуация из практики (урок, тема, что делали обучающиеся)": "Тәжірибеден алынған жағдай (сабақ, тақырып, білім алушылар не істеді)", "Какие принципы Scaffold проявились": "Scaffold-тың қандай қағидаттары көрінді", "Какие навыки развивались": "Қандай дағдылар дамыды", "Рефлексия": "Рефлексия", "Структура и содержание карточек. Ключевые компетенции": "Карточкалардың құрылымы мен мазмұны. Негізгі құзыреттер", "Планирование занятия группами карт": "Сабақты карталар топтарымен жоспарлау", "Группа 2–3 человека": "2–3 адамнан тұратын топ", "Изучите структуру и группы карт Scaffold и объясните, как каждая группа помогает педагогу на разных этапах планирования урока. В результате презентуйте макет коллегам.": "Scaffold карталарының құрылымы мен топтарын зерделеңіз, әрбір топтағы карталардың сабақ жоспарлаудың әртүрлі кезеңдерінде педагогқа қалай көмектесетінін түсіндіріңіз. Тапсырма 2–3 адамнан тұратын топтарда орындалады, тапсырма орындалғаннан кейін тыңдаушылар макетті таныстырады.", "1. Карточки «Задание»: определите своё учебное занятие": "1. Әрбір «Тапсырма» картасының айналасына стикерлер орналастырып, өзіңіздің оқу сабағыңызды анықтаңыз", "2. Карточки «Планирование»: соберите правильную последовательность": "2. «Жоспарлау» карточкаларын қатарлап қойып, олардың ретін құрастырыңыз", "Почему эта группа карт имеет строго определённую последовательность?": "Неліктен бұл карта тобының қатаң белгіленген реті бар?", "3. Сквозные компетенции для вашей специальности": "3. Мамандығыңызға қатысты ең өзекті икемді құзыреттер", "Почему выбрана именно эта компетенция?": "Неліктен дәл осы құзыретті таңдадыңыз?", "4. Метод оценки стартового уровня": "4. Білім алушылардың дайындық деңгейін анықтауға арналған бағалау әдісі", "Почему выбран этот метод? Как часто вы его применяете? Пример из опыта": "Бұл бағалау әдісін педагогикалық тәжірибеңізде қаншалықты жиі қолданасыз? Өз тәжірибеңізден мысал келтіріңіз", "5. Метод(ы) обучения и ресурсы": "5. Оқыту әдіс(тер)і және ресурстар", "Ваш подход к преподаванию на основе метода": "Таңдалған әдістерге сүйене отырып оқытуға арналған тәсіл", "Какие ресурсы вам будут необходимы?": "Қандай ресурстар қажет болады?", "Связь сквозных компетенций с рамками ЕС": "Икемді құзыреттердің ЕО шеңберлерімен байланысы", "В паре / группе": "Жұпта / топта", "Выберите из группы «Сквозные компетенции» 1–2 компетенции и подберите для них по одной карте из четырёх рамок Европейского союза: DigComp, LifeComp, EntreComp, GreenComp. Покажите связь и презентуйте результат коллегам.": "«Икемді құзыреттер» тобының ішінен 1–2 құзыреттілікті таңдаңыз және оларға Еуропалық Одақтың төрт құзыреттілік шеңбері (DigComp, LifeComp, EntreComp, GreenComp) бойынша ұсынылған негізгі құзыреттіліктер картасынан бір-бір картадан сәйкестендіріңіз. Олардың арасындағы байланысты көрсетіңіз және алынған нәтижені әріптестеріңізге ұсыныңыз.", "Сквозная компетенция": "Икемді құзырет", "Связь с DigComp": "DigComp-пен байланыс", "Связь с EntreComp": "EntreComp-пен байланыс", "Связь с GreenComp": "GreenComp-пен байланыс", "Связь с LifeComp": "LifeComp-пен байланыс", "Сравнение методов обучения": "Оқыту әдістерін салыстыру", "Изучите карты «Методы обучения» и заполните таблицу, сравнив методы по критериям. Затем напишите краткий анализ: какой метод наиболее подходит вашим обучающимся и почему.": "«Оқыту әдістері» карталарын және олардың әртүрлі білім беру контекстінде қолданылуын зерттеңіз. Әдістерді критерийлер бойынша салыстырып, кестені толтырыңыз және қысқаша талдау жазыңыз.", "Цели и задачи метода": "Әдістің мақсаттары мен міндеттері", "Роль преподавателя и студента": "Педагог пен студенттің рөлі", "Преимущества и ограничения": "Артықшылықтар мен шектеулер", "Примеры успешного применения": "Оқытудағы тиімді қолданудың мысалдары", "Развивать командную работу, коммуникацию, взаимопомощь": "Командалық жұмысты, коммуникацияны, өзара көмекті дамыту", "Преподаватель организует работу; студенты распределяют роли и совместно решают задачу": "Оқытушы жұмысты ұйымдастырады; студенттер рөлдерді бөліп, міндетті бірлесіп шешеді", "+ обмен опытом, развитие общения; − возможен неравный вклад участников": "+ тәжірибе алмасу, қарым-қатынасты дамыту; − қатысушылардың үлесі тең болмауы мүмкін", "Группа решает практическую задачу, распределив роли": "Топ рөлдерді бөліп, практикалық міндетті шешеді", "Учитывать потребности, интересы и уровень каждого учащегося": "Әр білім алушының қажеттіліктерін, қызығушылықтарын және деңгейін ескеру", "Преподаватель создаёт выбор и поддержку; студент определяет цели и темп работы": "Оқытушы таңдау мен қолдау жасайды; студент жұмыстың мақсаттары мен қарқынын анықтайды", "+ индивидуальный подход, мотивация; − требует больше подготовки": "+ жеке тәсіл, мотивация; − көбірек дайындықты талап етеді", "Задания разных уровней сложности по одной теме": "Бір тақырып бойынша күрделілігі әртүрлі деңгейдегі тапсырмалар", "Создать результат, полезный другим людям или организации": "Басқа адамдарға немесе ұйымға пайдалы нәтиже жасау", "Преподаватель направляет; студенты выявляют потребность и создают полезный продукт": "Оқытушы бағыттайды; студенттер қажеттілікті анықтап, пайдалы өнім жасайды", "+ связь с реальной жизнью; − сложно подобрать реального получателя результата": "+ нақты өмірмен байланыс; − нәтиженің нақты алушысын табу қиын", "Создание рекомендаций по энергосбережению для колледжа": "Колледж үшін энергия үнемдеу бойынша ұсынымдар жасау", "Формировать практические и исследовательские навыки": "Практикалық және зерттеушілік дағдыларды қалыптастыру", "Преподаватель обеспечивает условия и безопасность; студенты проводят опыт, измеряют, анализируют": "Оқытушы жағдай мен қауіпсіздікті қамтамасыз етеді; студенттер тәжірибе жасайды, өлшейді, талдайды", "+ обучение через практику; − нужны оборудование и время": "+ практика арқылы оқу; − жабдық пен уақыт қажет", "Исследование зависимости силы тока от напряжения": "Ток күшінің кернеуге тәуелділігін зерттеу", "Решать реальную проблему и создавать конечный продукт": "Нақты мәселені шешу және соңғы өнім жасау", "Преподаватель — консультант; студенты планируют, исследуют, создают и представляют продукт": "Оқытушы — кеңесші; студенттер өнімді жоспарлайды, зерттейді, жасайды және таныстырады", "+ самостоятельность, комплексные компетенции; − длительность и сложность организации": "+ дербестік, кешенді құзыреттер; − ұзақтығы мен ұйымдастырудың күрделілігі", "Проект «Энергоэффективный кабинет»": "«Энергия тиімді кабинет» жобасы", "Совмещать обучение с полезной деятельностью для общества": "Оқуды қоғамға пайдалы іс-әрекетпен ұштастыру", "Преподаватель организует взаимодействие; студенты применяют знания для решения общественной задачи": "Оқытушы өзара әрекеттесуді ұйымдастырады; студенттер қоғамдық міндетті шешу үшін білімін қолданады", "+ социальная значимость; − требуется взаимодействие с внешними участниками": "+ әлеуметтік маңыздылық; − сыртқы қатысушылармен өзара әрекеттесу қажет", "Экологическая акция с анализом и сортировкой отходов": "Қалдықтарды талдау және сұрыптау арқылы экологиялық акция", "Повысить мотивацию и закрепить знания через игровую деятельность": "Ойын әрекеті арқылы мотивацияны арттыру және білімді бекіту", "Преподаватель задаёт правила; студенты выполняют задания, принимают решения, получают обратную связь": "Оқытушы ережелерді белгілейді; студенттер тапсырмаларды орындайды, шешім қабылдайды, кері байланыс алады", "+ интерес и активность; − игра может отвлечь от учебной цели": "+ қызығушылық пен белсенділік; − ойын оқу мақсатынан алаңдатуы мүмкін", "Викторина, квест или соревнование по теме урока": "Сабақ тақырыбы бойынша викторина, квест немесе жарыс", "Какой из методов наиболее подходит для обучающихся в вашем контексте и почему?": "Қысқаша талдау: сіздің контексте қай әдіс ең тиімді болып табылады және неге?", "Например: эффективнее сочетание методов — проектное обучение дополняю сотрудничеством, лабораторной работой и игровыми элементами…": "Мысалы: әдістерді ұштастыру тиімдірек — жобалық оқытуды ынтымақтастықпен, зертханалық жұмыспен және ойын элементтерімен толықтырамын…", "Задание по методу «Обучение в сотрудничестве»": "«Ынтымақтастықта оқыту» картасы бойынша тапсырма", "Группа 4–5 человек": "4–5 адамнан тұратын топ", "Разработайте учебное задание по выбранной теме, используя метод обучения в сотрудничестве.     else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='style') e.style.cssText=v; else e.setAttribute(k,v===true?'':v);

  return e;
}

function frac(f,x,v){
  switch(f.t){
    case 'h': case 'note': case 'fig': case 'viz': return null;
    case 'text': case 'area': return nonEmpty(x)?1:0;
    case 'list': { const n=(x||[]).filter(nonEmpty).length; return Math.min(1,n/(f.min||1)); }
    case 'rep': { const n=(x||[]).filter(it=>it&&Object.values(it).some(z=>Array.isArray(z)?z.length:nonEmpty(String(z??'')))).length; return Math.min(1,n/(f.min||1)); }
    case 'table': { const tot=f.rows.length*f.cols.length; let n=0; for(let r=0;r<f.rows.length;r++)for(let c=0;c<f.cols.length;c++) if(nonEmpty((x||{})[r+'|'+c])) n++; return n/tot; }
    case 'cards': return (x||[]).length?1:0;
    case 'rank': return x&&x.touched?1:0;
    case 'order': return x&&x.checked?1:0;
    case 'stickies': return f.cards.filter(c=>nonEmpty((x||{})[c])).length/f.cards.length;
    case 'mindmap': { const ns=(x&&x.nodes)||[]; if(!ns.length) return 0; let n=0; ns.forEach(b=>{ if(nonEmpty(b.p))n++; if(nonEmpty(b.r))n++; }); return n/(ns.length*2); }
    case 'emotions': return Object.values(x||{}).filter(nonEmpty).length/6;
    case 'swot': return ['s','w','o','t'].filter(k=>((x||{})[k]||[]).filter(nonEmpty).length).length/4;
    case 'quad2': return f.items.filter(it=>{ const y=(x||{})[it.k]; return it.list?(y||[]).filter(nonEmpty).length:nonEmpty(y); }).length/f.items.length;
    case 'rating': { const tot=f.rows.length*3; return Object.keys(x||{}).length/tot; }
    case 'score': return x&&Object.keys(x).length?1:0;
    case 'check': return Object.values(x||{}).filter(Boolean).length/f.items.length;
    case 'choice': return nonEmpty(x)?1:0;
    case 'stairs': return Math.min(1,(x||[]).filter(s=>nonEmpty(s&&s.s)).length/(f.min||1));
    case 'row': { const fs=f.items.map(g=>frac(g,v[g.k],v)); return fs.reduce((a,b)=>a+b,0)/fs.length; }
  }
  return null;
}
function actPct(a){ try{ return actPct0(a); }catch(e){ return 0; } }
function actPct0(a){
  const v=S.a[a.id]||{}; const fs=a.fields.map(f=>frac(f,v[f.k],v)).filter(x=>x!=null);
  return fs.length? fs.reduce((x,y)=>x+y,0)/fs.length : 0;
}

  const r=$('#ring'); if(r){ const C=2*Math.PI*13; r.innerHTML=`<svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="16" cy="16" r="13" fill="none" stroke="var(--pen)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*avg} ${C}" transform="rotate(-90 16 16)"/></svg><span>${T('{0} из {1} заданий','<b>'+done+'</b>',tot)}</span>`; }
