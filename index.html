function fieldHTML(f,x,v){
  const p=s=>`<p>${esc(s).replace(/\n/g,'<br>')}</p>`;
  const L=f.label?`<p><b>${esc(T(f.label))}</b></p>`:'';
  const cardT=id=>CARD[id]?`${T(CARD[id].title)} (${T(GROUPS[CARD[id].g].short)}${id.includes('.')?' '+id:''})`:'';
  const TB='<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%">';
  switch(f.t){
    case 'h': return `<h4>${esc(T(f.text))}</h4>`;
    case 'note': return '';
    case 'viz': return vizHTML(VIZ[f.key](v), f.cap);
    case 'fig': { const list=(f[LANG]||[]).filter(n=>FIGS[n]); return list.length? list.map(n=>`<p data-fig="${n}"></p>`).join('')+`<p class="cap"><i>${esc(T(f.cap))}</i></p>`:''; }
    case 'text': case 'area': return nonEmpty(x)? L+p(x) : '';
    case 'choice': return nonEmpty(x)? L+p(T(x)) : '';
    case 'row': return f.items.map(g=>fieldHTML(g,v[g.k],v)).join('');
    case 'list': { const a=(x||[]).filter(nonEmpty); return a.length? L+'<ol>'+a.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>':''; }
    case 'check': return L+'<ul>'+f.items.map((t,i)=>`<li>${(x||{})[i]?'☑':'☐'} ${esc(T(t))}</li>`).join('')+'</ul>';
    case 'table': { const X=x||{}; const cn=i=>f.colInput?(X['h|'+i]||T((f.colDefaults||[])[i]||f.cols[i])):T(f.cols[i]);
      return L+TB+`<tr><th></th>${f.cols.map((c,i)=>`<th>${esc(cn(i))}</th>`).join('')}</tr>`+f.rows.map((r,ri)=>`<tr><th align="left">${esc(T(r))}</th>${f.cols.map((c,ci)=>`<td>${esc(X[ri+'|'+ci]||'').replace(/\n/g,'<br>')}</td>`).join('')}</tr>`).join('')+'</table>'; }
    case 'cards': { const a=x||[]; return a.length? L+'<ul>'+a.map(it=>`<li><b>${esc(cardT(it.id))}</b>${nonEmpty(it.why)?' — '+esc(it.why):''}</li>`).join('')+'</ul>':''; }
    case 'rep': { const a=(x||[]).filter(it=>it&&Object.values(it).some(z=>Array.isArray(z)?z.length:nonEmpty(String(z??'')))); if(!a.length) return '';
      let s=TB+`<tr><th>№</th>${f.fields.map(sf=>`<th>${esc(T(sf.label))}</th>`).join('')}</tr>`;
      a.forEach((it,i)=>{ s+=`<tr><td>${i+1}</td>${f.fields.map(sf=>{ let z=it[sf.k]; if(sf.t==='card') z=cardT(z); else if(Array.isArray(z)) z=z.map(T).join('; '); else if(sf.t==='select') z=T(z); return `<td>${esc(z||'').replace(/\n/g,'<br>')}</td>`; }).join('')}</tr>`; });
      if(f.total) s+=`<tr><td></td><td colspan="${f.fields.length}" align="right"><b>${esc(T(f.totalLabel||'Итого'))}: ${a.reduce((q,it)=>q+(parseFloat(it[f.total])||0),0)}</b></td></tr>`;
      return s+'</table>'; }
    case 'rank': return vizHTML(VIZ.stairs(v), 'Лестница приоритетов принципов Scaffold');
    case 'rank_old': { const o=(x&&x.o)||f.items.map((_,i)=>i); return `<p><b>${esc(T('Принципы Scaffold по приоритету'))}</b></p><ol>`+o.map(i=>`<li>${esc(T(f.items[i]))}</li>`).join('')+'</ol>'; }
    case 'order': { const o=(x&&x.o)||[]; return o.length?`<p><b>${esc(T('Последовательность карт «Планирование»'))}</b></p><ol>`+o.map(id=>`<li>${esc(T(CARD[id].title))}</li>`).join('')+'</ol>':''; }
    case 'stickies': return TB+f.cards.map(id=>`<tr><th align="left" width="30%">${esc(T(CARD[id].title))}</th><td>${esc((x||{})[id]||'')}</td></tr>`).join('')+'</table>';
    case 'mindmap': { const ns=((x&&x.nodes)||[]).filter(b=>nonEmpty(b.n)||nonEmpty(b.p)||nonEmpty(b.r)); if(ns.length) return vizHTML(vizMindmap(T(f.center),ns),'Моя ментальная карта'); return ''; }
    case 'mindmap_old': { const ns=(x&&x.nodes)||[]; return `<p><b>${esc(T(f.center))}</b></p>`+TB+`<tr><th>${esc(T('Элемент'))}</th><th>${esc(T('Влияние на процесс обучения'))}</th><th>${esc(T('Влияние на профессиональную деятельность'))}</th></tr>`+ns.map(b=>`<tr><td>${esc(b.n)}</td><td>${esc(b.p)}</td><td>${esc(b.r)}</td></tr>`).join('')+'</table>'; }
    case 'emotions': { const X=x||{}; if(Object.values(X).some(nonEmpty)) return vizHTML(vizStrategies(X),'Мои стратегии управления поведением'); return ''; }
    case 'emotions_old': { const X=x||{}; const ks=Object.keys(X).filter(k=>nonEmpty(X[k])); return ks.length?`<p><b>${esc(T('Карта эмоций'))}</b></p><ul>`+ks.map(k=>`<li><b>${esc(T(k))}:</b> ${esc(X[k])}</li>`).join('')+'</ul>':''; }
    case 'swot': { const X=x||{}; const q=k=>'<ul>'+((X[k]||[]).filter(nonEmpty).map(s=>`<li>${esc(s)}</li>`).join(''))+'</ul>';
      return `<table border="1" cellpadding="6" style="border-collapse:collapse;width:100%"><tr><td width="50%"><b>S — ${esc(T('Сильные стороны'))}</b>${q('s')}</td><td><b>W — ${esc(T('Слабые стороны'))}</b>${q('w')}</td></tr><tr><td><b>O — ${esc(T('Возможности'))}</b>${q('o')}</td><td><b>T — ${esc(T('Угрозы'))}</b>${q('t')}</td></tr></table>`; }
    case 'quad2': if(f.k==='goals'){ const X=x||{}; if([...(X.short||[]),...(X.long||[])].some(nonEmpty)) return vizHTML(VIZ.goals(v),'Схема: мои цели'); return ''; }
      return f.items.map(it=>fieldHTML(it.list?{t:'list',label:it.label}:{t:'area',label:it.label},(x||{})[it.k],x||{})).join('');
    case 'rating': { const X=x||{}; const src=v[f.colsFrom]||{}; const names=[0,1,2].map(i=>src['h|'+i]||T(ACT['2.1'].fields[0].colDefaults[i]));
      return TB+`<tr><th>${esc(T('Оценка 1–5'))}</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>`+f.rows.map((r,ri)=>`<tr><td>${esc(T(r))}</td>${[0,1,2].map(ci=>`<td align="center">${X[ri+'|'+ci]||''}</td>`).join('')}</tr>`).join('')+'</table>'; }
    case 'score': { const X=x||{}; const s=f.items.reduce((q,_,i)=>q+(+X[i]||0),0); return L+'<ul>'+f.items.map((it,i)=>`<li>${esc(T(it.t))}: ${X[i]??0} / ${it.max}</li>`).join('')+`</ul><p><b>${f.avg?esc(T('Итоговая оценка'))+': '+Math.round(s/f.items.length)+' / 100':esc(T('Итого'))+': '+s}</b></p>`; }
    case 'stairs': { const a=(x||[]).filter(it=>nonEmpty(it.s)); return a.length?`<p><b>${esc(T(f.label))}</b></p><ol>`+a.map(it=>`<li>${esc(it.s)}${nonEmpty(it.d)?' — '+esc(it.d):''}</li>`).join('')+'</ol>':''; }
  }
  return '';
}

async function svgToPng(svg,w,h,scale=2){
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); const img=new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
  const c=document.createElement('canvas'); c.width=Math.round(w*scale); c.height=Math.round(h*scale); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  const b=await new Promise(r=>c.toBlob(r,'image/png')); return new Uint8Array(await b.arrayBuffer());
}

function parseRoute(h){ h=String(h||'').replace(/^#/,''); try{ h=decodeURIComponent(h); }catch(e){} if(h.startsWith('a')&&ACT[h.slice(1)]) return {page:'act',id:h.slice(1)}; if(['deck','crit','home','refl'].includes(h)) return {page:h}; return {page:'home'}; }
let ROUTE=parseRoute(location.hash);
function currentRoute(){ return ROUTE; }
function go(h){ ROUTE=parseRoute(h); try{ history.replaceState(null,'','#'+h); }catch(e){} $('#nav').classList.remove('open'); render(); try{ window.scrollTo({top:0}); }catch(e){ window.scrollTo(0,0); } }
function renderNav(){
  const r=currentRoute(); const n=$('#nav'); n.innerHTML='';
  const tool=(h,ic,t)=>el('a',{class:'nav-tool'+(r.page===h?' on':''),href:'#'+h,onclick:()=>n.classList.remove('open')},iconEl(ic),T(t));
  n.append(el('div',{class:'nav-tools'}, tool('home','home','Главная'), tool('deck','deck','Колода карт Scaffold'), tool('crit','crit','Критерии итоговой работы'),
    el('a',{class:'nav-tool',href:'#',onclick:e=>{e.preventDefault();exportDoc();}},iconEl('dl'),T('Скачать тетрадь (Word)')),
    el('a',{class:'nav-tool',href:'#',onclick:e=>{e.preventDefault();exportBackup();}},iconEl('save'),T('Сохранить ответы в файл')),
    el('a',{class:'nav-tool',href:'#',onclick:e=>{e.preventDefault();importBackup();}},iconEl('open'),T('Загрузить ответы из файла'))));
  for(const m of MODULES){
    n.append(el('div',{class:'nav-mod'}, T(m.title)));
    for(const t of m.topics){
      n.append(el('div',{class:'nav-topic'}, `${TL(t.id)}. ${T(t.title)}`));
      for(const a of t.acts) n.append(el('a',{class:'nav-act'+(r.id===a.id?' on':''),href:'#a'+a.id,'data-id':a.id,onclick:()=>n.classList.remove('open')}, el('span',{class:'num'},a.id), el('span',{},T(a.title)), stEl(actPct(a))));
    }
  }
  n.append(el('div',{class:'nav-mod'},T('Завершение курса')));
  const rv=S.a.refl||{};
  n.append(el('a',{class:'nav-act'+(r.page==='refl'?' on':''),href:'#refl'}, el('span',{class:'num'},'✎'), el('span',{},T('Рефлексия слушателя')), stEl(nonEmpty(rv.text)?1:0)));
}
function renderHome(main){
  const pr=V('profile'); const ch=()=>touch('profile');
  const next=ACTS.find(a=>actPct(a)<.999);
  const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'hero'},
    el('div',{class:'eyebrow'},T('НАО «Talap» · Центр педагогического мастерства')),
    el('h1',{},T('Рабочая тетрадь слушателя')),
    el('p',{},T('Курс «Проектирование учебных занятий с применением инструмента Scaffold». Здесь вы выполняете все активити двух модулей, работаете с картами Scaffold и собираете итоговый план урока.')),
    el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-top:4px'},
      next? el('a',{class:'btn pri',href:'#a'+next.id}, T(ACTS.some(a=>actPct(a)>0)?'Продолжить:':'Начать:')+' '+AL(next.id)) : el('span',{class:'res ok'},T('Все задания выполнены')),
      el('button',{class:'btn',type:'button',onclick:exportDoc},iconEl('dl'),T('Скачать в Word')),
      el('button',{class:'btn',type:'button',onclick:exportBackup},iconEl('save'),T('Сохранить ответы в файл')),
      el('button',{class:'btn',type:'button',onclick:importBackup},iconEl('open'),T('Загрузить из файла')))));
  const prof=el('div',{class:'box'}, el('h2',{},T('Слушатель')),
    ...[['name','ФИО'],['org','Место работы (колледж)'],['pos','Должность'],['subj','Предмет / специальность']].map(([k,l])=>{ const id='p-'+k; return el('div',{class:'fl'}, el('label',{for:id},T(l)), textInput(()=>pr[k],x=>pr[k]=x,ch,{id})); }));
  const mods=el('div',{class:'box'}, el('h2',{},T('Прогресс')));
  MODULES.forEach(m=>{ const as=m.topics.flatMap(t=>t.acts); const d=as.filter(a=>actPct(a)>=.999).length; const avg=as.reduce((s,a)=>s+actPct(a),0)/as.length;
    mods.append(el('a',{class:'mod-p',href:'#a'+as[0].id,style:'color:inherit;text-decoration:none'}, el('div',{class:'t'},el('b',{},T(m.title)),el('span',{},`${d} / ${as.length}`)), el('div',{class:'bar'},el('i',{style:`width:${Math.round(avg*100)}%`})))); });
  mods.append(el('ul',{class:'how'},
    el('li',{},el('b',{},'1'),el('span',{},T(OFFLINE?'Ответы сохраняются автоматически в этом браузере. Чтобы продолжить на другом устройстве, сохраните ответы в файл и загрузите его там.':'Ответы сохраняются автоматически. Если вы вошли в аккаунт, тетрадь доступна с любого устройства и видна только вам.'))),
    el('li',{},el('b',{},'2'),el('span',{},T('Нажмите на любую карту, чтобы прочитать её описание, советы и связи с другими компетенциями.'))),
    el('li',{},el('b',{},'3'),el('span',{},T(OFFLINE?'Когда закончите, скачайте тетрадь в Word и сдайте тренеру.':'После задания попросите отзыв ИИ-тренера, а в конце скачайте тетрадь в Word и сдайте тренеру.')))));
  const deck=el('div',{class:'box',style:'grid-column:1/-1'}, el('h2',{},T('Колода Scaffold: 93 карты в 9 группах')),
    el('div',{class:'deck-strip'}, Object.entries(GROUPS).map(([g,G])=>el('a',{class:G.cls,href:'#deck',onclick:()=>{deckFilter=g;}},T(G.short)))),
    el('p',{style:'margin:0;font-size:13.5px;color:var(--ink-2)'},T('Цель курса — развить педагогические компетенции для проектирования компетентностно-ориентированных занятий. По завершении вы применяете методы Scaffold при создании структурных элементов занятий и проектируете учебное занятие для формирования ключевых компетенций обучающихся.')));
  sheet.append(el('div',{class:'home-grid'},prof,mods,deck));
  main.append(sheet);
}
let deckFilter='all', deckQ='';
function renderDeck(main){
  const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-h'}, el('div',{class:'eyebrow'},T('Справочник')), el('h1',{},T('Колода карт Scaffold')), el('p',{style:'margin:0;color:var(--ink-2);max-width:70ch'},T('Все карты из набора с описаниями, заданиями для обучающихся и связями между рамками компетенций.'))));
  const chips=el('div',{class:'chips'});
  const grid=el('div',{class:'cgrid',style:'margin-top:16px'});
  const draw=()=>{
    chips.innerHTML='';
    [['all','Все'],...Object.entries(GROUPS).map(([g,G])=>[g,G.short])].forEach(([g,t])=>chips.append(el('button',{type:'button',class:'chip'+(deckFilter===g?' on':''),onclick:()=>{deckFilter=g;draw();}},T(t))));
    grid.innerHTML='';
    const gs= deckFilter==='all'? Object.keys(GROUPS) : [deckFilter];
    gs.forEach(g=>{ const list=CARDS.filter(c=>c.g===g&&(!deckQ||(T(c.title)+' '+T(c.desc)+' '+T(c.task||'')+' '+c.id).toLowerCase().includes(deckQ))); if(!list.length) return;
      grid.append(el('div',{class:'cgroup-h'},`${T(GROUPS[g].name)} · ${list.length}`)); list.forEach(c=>grid.append(cardEl(c.id,{desc:true,onClick:()=>openCard(c.id)}))); });
    if(!grid.children.length) grid.append(el('p',{style:'color:var(--ink-3)'},T('Ничего не найдено. Измените запрос.')));
  };
  const s=el('input',{class:'inp',type:'search',id:'deck-q',placeholder:T('Поиск: например, «рефлексия» или «e.4»'),style:'max-width:420px',oninput:e=>{deckQ=e.target.value.trim().toLowerCase();draw();}}); s.value=deckQ;
  sheet.append(el('div',{style:'display:grid;gap:12px'},s,chips),grid);
  draw(); main.append(sheet);
}
function renderCrit(main){
  const x=V('crit'); const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-h'}, el('div',{class:'eyebrow'},T('Приложение 1 к образовательной программе')), el('h1',{},T('Критерии оценки итоговой работы')),
    el('div',{class:'task'}, el('p',{},T('Предмет оценивания — план урока с использованием инструмента Scaffold (Activity 2.15). Оцените свою работу по критериям. Для рекомендации к сертификации нужно не менее 50 баллов из 100 и все активити по каждому модулю.')))));
  const big=el('span',{class:'big'}); const st=el('span',{class:'res'});
  const upd=()=>{ const t=CRITERIA.reduce((s,_,i)=>s+(+x[i]||0),0); big.textContent=t; st.className='res '+(t>=50?'ok':'no'); st.textContent=T(t>=50?'Порог сертификации пройден':'Ниже порога 50 баллов'); };
  const box=el('div',{class:'score'});
  CRITERIA.forEach((c,i)=>{ const out=el('span',{class:'score-v'}); const r=el('input',{type:'range',min:'0',max:String(c.max),id:'cr'+i,'aria-label':T(c.t)}); r.value=x[i]??0; out.textContent=(x[i]??0)+' / '+c.max;
    r.addEventListener('input',()=>{x[i]=+r.value;out.textContent=r.value+' / '+c.max;upd();touch('crit');}); box.append(el('div',{class:'score-it'},el('label',{for:r.id},T(c.t)),r,out)); });
  sheet.append(el('div',{class:'crit-total',style:'margin-bottom:16px'}, big, el('span',{class:'of'},T('из 100')), st, el('a',{class:'btn sm',href:'#a2.15',style:'margin-left:auto'},T('Открыть план урока 2.15'))), box);
  sheet.append(el('div',{class:'acts-bar'}, el('span',{style:'flex:1'}), el('a',{class:'btn pri',href:'#refl'},T('Рефлексия слушателя'),iconEl('right'))));
  upd(); main.append(sheet);
}
function renderRefl(main){
  const x=V('refl'); const ch=()=>touch('refl'); const pr=S.a.profile||{};
  const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-h'}, el('div',{class:'eyebrow'},T('Завершение курса')), el('h1',{},T('Рефлексия слушателя')),
    el('div',{class:'task'}, el('p',{},T('Опишите своими словами итоги курса: что нового вы узнали, что уже применяете или будете применять в работе, что было трудным и над чем хотите работать дальше.')))));
  const hints=['Что нового я узнал(а) на курсе?','Какие карты и методы Scaffold я буду применять на своих занятиях?','Что вызвало трудности и почему?','Как изменится моя работа с обучающимися?','Над чем я хочу работать дальше?'];
  const ta=textInput(()=>x.text,v=>x.text=v,ch,{area:true,rows:12,id:'refl-text',ph:T('Моя рефлексия…')});
  const chips=el('div',{class:'chips'}, hints.map(h=>el('button',{type:'button',class:'chip hint',title:T('Добавить вопрос-подсказку'),onclick:()=>{ const q=T(h); x.text=(nonEmpty(x.text)?x.text.replace(/\s*$/,'')+'\n\n':'')+q+'\n'; ta.value=x.text; ch(); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }},T(h))));
  const sign=el('div',{class:'sign'}, ...[['','подпись'],[pr.pos||'','должность'],[pr.name||'','Ф.И.О.']].map(([v,l])=>el('div',{class:'sign-c'}, el('div',{class:'sign-v'},v||'\u00a0'), el('div',{class:'sign-l'},T(l)))));
  sheet.append(el('div',{class:'fields'},
    el('div',{class:'fl'}, el('label',{for:'refl-text'},T('Рефлексия слушателя')), chips, ta),
    el('div',{class:'fl'}, el('div',{class:'lbl'},T('Подпись')), sign, el('div',{class:'note'},T('Должность и Ф.И.О. берутся со страницы «Главная». Подпись ставится от руки в распечатанном документе.'))),
    el('div',{class:'fl'}, el('label',{for:'refl-notes'},T('Для заметок')), textInput(()=>x.notes,v=>x.notes=v,ch,{area:true,rows:5,id:'refl-notes'}))));
  sheet.append(el('div',{class:'acts-bar'}, el('a',{class:'btn ghost',href:'#crit'},iconEl('left'),T('Критерии итоговой работы')), el('span',{style:'flex:1'}), el('button',{class:'btn pri',type:'button',onclick:exportDoc},iconEl('dl'),T('Скачать тетрадь (Word)'))));
  main.append(sheet);
}
function renderAct(main,id){
  const a=ACT[id]; const v=V(a.id);
  const i=ACTS.indexOf(a); const prev=ACTS[i-1], next=ACTS[i+1];
  const sheet=el('div',{class:'sheet'});
  sheet.append(el('div',{class:'act-num','aria-hidden':'true'},a.id));
  const meta=el('div',{class:'meta'}, el('span',{class:'tag'},T(a.mode)));
  if(a.card) meta.append(el('div',{style:'width:240px;max-width:100%'}, cardEl(a.card,{mini:true,onClick:()=>openCard(a.card)})));
  sheet.append(el('div',{class:'act-h'},
    el('div',{class:'eyebrow'},`${T(a.module.id==='m1'?'Модуль 1':'Модуль 2')} · ${TL(a.topic.id)} · ${AL(a.id)}`),
    el('h1',{},T(a.title)), meta,
    el('div',{class:'task'}, el('p',{},T(a.task)), a.steps?el('ol',{},a.steps.map(s=>el('li',{},T(s)))):null)));
  const fields=el('div',{class:'fields'}); a.fields.forEach(f=>{ try{ fields.append(mount(f,v,a)); }catch(err){ console.error('field',a.id,f.k||f.t,err); if(f.k&&v[f.k]!=null&&!['text','area','choice'].includes(f.t)){ const bak=v[f.k]; delete v[f.k]; try{ fields.append(mount(f,v,a)); return; }catch(e2){ v[f.k]=bak; } } fields.append(el('div',{class:'note'},T('Не удалось показать это поле. Остальная часть задания работает.'))); } }); sheet.append(fields);
  const fb=el('div',{class:'fb',hidden:!v._fb}); if(v._fb){ fb.append(el('div',{class:'fb-h'},T('Отзыв ИИ-тренера')), el('div',{},v._fb)); }
  const aiBtn=el('button',{class:'btn',type:'button',hidden:true,onclick:()=>aiFeedback(a,fb,aiBtn)},iconEl('spark'), T(a.final?'Предварительная оценка ИИ-тренера':'Отзыв ИИ-тренера'));
  getSample().then(s=>{ if(s) aiBtn.hidden=false; });
  sheet.append(el('div',{class:'acts-bar'},
    prev?el('a',{class:'btn ghost',href:'#a'+prev.id},iconEl('left'),AL(prev.id)):null,
    aiBtn, el('span',{style:'flex:1'}),
    el('span',{style:'font-size:13px;color:var(--ink-3)'},T('Заполнено {0}%',Math.round(actPct(a)*100))),
    next?el('a',{class:'btn pri',href:'#a'+next.id},AL(next.id),iconEl('right')):el('a',{class:'btn pri',href:'#crit'},T('К критериям'),iconEl('right'))), fb);
  main.append(sheet);
}
function render(){
  const r=currentRoute(); const main=$('#main'); main.innerHTML='';
  try{ if(r.page==='act') renderAct(main,r.id); else if(r.page==='deck') renderDeck(main); else if(r.page==='crit') renderCrit(main); else if(r.page==='refl') renderRefl(main); else renderHome(main); }
  catch(err){ console.error(err); main.innerHTML=''; main.append(el('div',{class:'sheet'},el('h1',{},T('Не удалось открыть страницу')),el('p',{},String(err&&err.message||err)),el('button',{class:'btn',type:'button',onclick:()=>go('home')},T('Главная')))); }
  try{ renderNav(); refreshProgress(); }catch(err){ console.error(err); }
}
window.addEventListener('hashchange',()=>{ const nr=parseRoute(location.hash); if(nr.page===ROUTE.page&&nr.id===ROUTE.id) return; ROUTE=nr; render(); window.scrollTo({top:0}); });
document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return; const h=a.getAttribute('href').slice(1); if(!h) return; e.preventDefault(); go(h); });
$('#menu').addEventListener('click',()=>$('#nav').classList.toggle('open'));
document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.l!==LANG) setLang(b.dataset.l); }));
$('#theme').addEventListener('click',()=>setTheme(curTheme()==='dark'?'light':'dark'));
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(!THEME) applyChrome(); });
setStatus('local'); applyChrome(); render(); initCloud();

</script>
